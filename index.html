<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집중 기록 카메라</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; padding: 20px; }
        #container { position: relative; width: 100%; max-width: 500px; }
        video { width: 100%; border-radius: 20px; background: #000; transform: scaleX(-1); }
        .status-dot { position: absolute; top: 15px; right: 15px; width: 12px; height: 12px; background: #ff3b30; border-radius: 50%; display: none; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .controls { margin-top: 20px; background: white; padding: 15px 25px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; }
        button { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; }
        #startBtn { background: #007AFF; color: white; }
        .card { display: none; width: 100%; max-width: 500px; margin-top: 20px; padding: 20px; background: white; border-radius: 20px; text-align: center; box-sizing: border-box; }
        .eval-btn { background: #f1f3f5; border: none; padding: 10px 15px; border-radius: 10px; margin: 5px; flex: 1; }
        .selected-eval { background: #007AFF !important; color: white; }
    </style>
</head>
<body>

    <h2>🎯 집중 기록 모드</h2>
    
    <div id="container">
        <div class="status-dot" id="statusDot"></div>
        <video id="preview" autoplay muted playsinline></video>
    </div>

    <div class="controls" id="inputControl">
        <input type="number" id="minutes" value="1" min="1" style="width:40px; border:none; border-bottom:2px solid #007AFF; text-align:center; font-size:1.1rem;"> 분
        <button id="startBtn">시작</button>
    </div>

    <div class="card" id="evaluationArea">
        <h3>집중도 평가</h3>
        <div style="display:flex;">
            <button class="eval-btn" onclick="selectEval(this, '상')">🔥 상</button>
            <button class="eval-btn" onclick="selectEval(this, '중')">👍 중</button>
            <button class="eval-btn" onclick="selectEval(this, '하')">☁️ 하</button>
        </div>
        <button onclick="showPlayback()" style="width:100%; margin-top:15px; background:#333; color:white;">평가 완료</button>
    </div>

    <div class="card" id="playbackArea">
        <p>시작 시간: <span id="startTimeDisplay" style="font-weight:bold;">-</span></p>
        <video id="recording" controls style="transform:none;"></video>
        <div style="margin-top:15px;">
            배속: 
            <button class="eval-btn" onclick="setSpeed(1)">1x</button>
            <button class="eval-btn" onclick="setSpeed(2)">2x</button>
            <button class="eval-btn" onclick="setSpeed(4)">4x</button>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let startTime = "";

        const startBtn = document.getElementById('startBtn');
        const preview = document.getElementById('preview');

        // 아이패드/iOS 호환 코덱 확인 함수
        function getSupportedMimeType() {
            const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        startBtn.onclick = async () => {
            try {
                // 1. 카메라 권한 요청 (클릭 이벤트 안에서 실행되어야 함)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                preview.srcObject = stream;
                
                // 2. 녹화 설정
                recordedChunks = [];
                const mimeType = getSupportedMimeType();
                mediaRecorder = new MediaRecorder(stream, { mimeType });

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    document.getElementById('recording').src = URL.createObjectURL(blob);
                    document.getElementById('evaluationArea').style.display = 'block';
                    document.getElementById('inputControl').style.display = 'none';
                };

                // 3. 시작 시간 기록 및 녹화 개시
                startTime = new Date().toLocaleTimeString();
                mediaRecorder.start();
                
                document.getElementById('statusDot').style.display = 'block';
                startBtn.disabled = true;

                // 4. 타이머 종료 로직 (분 단위)
                const duration = document.getElementById('minutes').value * 60000;
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('statusDot').style.display = 'none';
                }, duration);

            } catch (err) {
                alert("아이패드 설정 > 사파리 > 카메라 권한을 확인해주세요.");
            }
        };

        function selectEval(btn, rating) {
            document.querySelectorAll('.eval-btn').forEach(b => b.classList.remove('selected-eval'));
            btn.classList.add('selected-eval');
        }

        function showPlayback() {
            document.getElementById('startTimeDisplay').innerText = startTime;
            document.getElementById('evaluationArea').style.display = 'none';
            document.getElementById('playbackArea').style.display = 'block';
        }

        function setSpeed(speed) {
            document.getElementById('recording').playbackRate = speed;
        }
    </script>
</body>
</html>
