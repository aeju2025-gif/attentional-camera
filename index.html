<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 수학 마스터 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-gray: #f2f2f7; --ios-green: #34c759; --ios-red: #ff3b30; }
        * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-gray); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; padding: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        
        /* 버튼은 손가락 터치 가능 */
        button, select { touch-action: manipulation; cursor: pointer; }
        
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .problem-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px; height: 300px; display: flex; flex-direction: column; position: relative; box-sizing: border-box; }
        
        .problem-header { display: flex; justify-content: space-between; align-items: center; min-height: 85px; margin-bottom: 5px; }
        .problem-text-area { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; font-weight: bold; }
        
        /* 캔버스: 손가락 터치 액션 완전 무시 */
        .canvas-wrapper { flex: 1; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; position: relative; overflow: hidden; touch-action: none !important; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        .btn-clear { border: none; background: #e5e5ea; color: #333; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; margin-left: 5px; }
        .hidden { display: none !important; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="loginGate" class="container">
    <h2 style="text-align:center;">🏫 온라인 연산 교실</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <button class="btn" style="height:120px; background:var(--ios-blue); border-radius:15px; color:white; font-weight:bold;" onclick="initStudent()">학생용</button>
        <button class="btn" style="height:120px; background:#5856d6; border-radius:15px; color:white; font-weight:bold;" onclick="showView('teacherLogin')">교사용</button>
    </div>
</div>

<div id="studentMain" class="container hidden">
    <label>연산 및 문제 수 설정 후 시작하세요</label>
    <select id="opMain" onchange="updateSubOptions()"><option value="add">덧셈 (+)</option><option value="sub">뺄셈 (-)</option></select>
    <select id="opSub"></select>
    <select id="problemType"><option value="vert">세로셈</option><option value="horiz">가로셈</option></select>
    <select id="setCount"><option value="1">1장</option><option value="5" selected>5장</option></select>
    <button onclick="startContinuousQuiz()" style="width:100%; padding:15px; background:var(--ios-blue); color:white; border:none; border-radius:12px; font-weight:bold;">학습 시작</button>
</div>

<div id="quizSection" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div id="timerDisplay" style="color:var(--ios-red); font-weight:bold;">00:00</div>
        <div id="setIndicator" style="background:#333; color:white; padding:4px 12px; border-radius:20px; font-size:0.8rem;">1 / 5 장</div>
        <button onclick="handleSetSubmit()" style="background:var(--ios-green); color:white; border:none; padding:8px 20px; border-radius:10px; font-weight:bold;">제출 / 다음</button>
    </div>
    <div id="quizArea" class="quiz-grid"></div>
</div>

<div id="teacherDashboard" class="container hidden"><div id="logList"></div></div>
<div id="teacherLogin" class="container hidden">
    <input type="password" id="tPass" placeholder="비밀번호 1234" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:10px;">
    <button onclick="checkTeacher()" style="width:100%; padding:15px; background:#5856d6; color:white; border:none; border-radius:10px;">로그인</button>
</div>

<script>
    // Firebase 설정 (기존과 동일)
    const firebaseConfig = { apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk", authDomain: "math-98dc8.firebaseapp.com", databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com", projectId: "math-98dc8", storageBucket: "math-98dc8.firebasestorage.app", messagingSenderId: "998893080786", appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let timer, seconds = 0, currentProblems = [], canvases = [], currentSet = 1, targetSets = 1;

    const subSteps = { add: [{v: "1", t: "받아올림 필수"}, {v: "2", t: "두자리+두자리"}], sub: [{v: "1", t: "받아내림 필수"}] };

    function showView(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function updateSubOptions() { const main = document.getElementById('opMain').value; document.getElementById('opSub').innerHTML = subSteps[main].map(s => `<option value="${s.v}">${s.t}</option>`).join(''); }
    function initStudent() { showView('studentMain'); updateSubOptions(); }

    function generateNumbers(op) {
        let n1, n2;
        if(op==='add'){ n1 = Math.floor(Math.random()*8)+2; n2 = Math.floor(Math.random()*(9-(10-n1)+1))+(10-n1); n1 = n1+10; } // 간단한 받아올림 예시
        else { n1 = 20; n2 = Math.floor(Math.random()*8)+1; }
        return [n1, n2];
    }

    function startContinuousQuiz() { currentSet = 1; targetSets = parseInt(document.getElementById('setCount').value); startQuiz(); }
    
    function startQuiz() {
        showView('quizSection'); seconds = 0;
        document.getElementById('setIndicator').innerText = `${currentSet} / ${targetSets} 장`;
        const area = document.getElementById('quizArea'); area.innerHTML = ""; currentProblems = []; canvases = [];
        for(let i=0; i<8; i++) {
            const nums = generateNumbers(document.getElementById('opMain').value);
            const p = { n1: nums[0], n2: nums[1], op: document.getElementById('opMain').value==='add'?'+':'-', type: document.getElementById('problemType').value };
            currentProblems.push(p); createCard(area, p, i);
        }
        if(timer) clearInterval(timer);
        timer = setInterval(() => { seconds++; document.getElementById('timerDisplay').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000);
    }

    function createCard(target, p, i) {
        const card = document.createElement('div');
        card.className = 'problem-card';
        let probHtml = p.type === 'horiz' ? `<span>${p.n1} ${p.op} ${p.n2} =</span>` : `<div style="text-align:right; font-family:monospace;">${p.n1}<br>${p.op} ${p.n2}<br><hr style="border:1px solid #333;"></div>`;
        card.innerHTML = `<div class="problem-header"><div style="width:40px;"></div><div class="problem-text-area">${probHtml}</div><button class="btn-clear" onclick="clearCnv('c-canv-${i}')">지우기</button></div><div class="canvas-wrapper"><canvas id="c-canv-${i}"></canvas></div>`;
        target.appendChild(card);
        setTimeout(() => setupCanvas(`c-canv-${i}`), 50);
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id); if(!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width; canvas.height = rect.height;
        const ctx = canvas.getContext('2d'); let drawing = false;

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        // 핵심: pointerType이 'pen'일 때만 반응 (손가락 'touch' 무시)
        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'pen') return; 
            e.preventDefault();
            drawing = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
        }, { passive: false });

        canvas.addEventListener('pointermove', (e) => {
            if (!drawing || e.pointerType !== 'pen') return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#007AFF';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }, { passive: false });

        canvas.addEventListener('pointerup', (e) => {
            if (e.pointerType === 'pen') drawing = false;
        });

        canvases[id.split('-').pop()] = canvas;
    }

    function clearCnv(id) { const c = document.getElementById(id); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }

    function handleSetSubmit() {
        const data = { date: new Date().toLocaleString(), imgs: canvases.map(c => c.toDataURL()), problems: currentProblems, setNum: currentSet };
        database.ref('records').push(data).then(() => {
            if(currentSet < targetSets) { currentSet++; startQuiz(); window.scrollTo(0,0); } 
            else { alert("완료!"); location.reload(); }
        });
    }

    function checkTeacher() { if(document.getElementById('tPass').value === "1234") { showView('teacherDashboard'); loadTeacherLogs(); } }
    function loadTeacherLogs() {
        database.ref('records').once('value', (snap) => {
            const logs = snap.val(); const list = document.getElementById('logList');
            if(!logs) return;
            list.innerHTML = Object.keys(logs).reverse().map(id => `<div style="border:1px solid #ddd; margin-top:10px; padding:10px; border-radius:10px;">${logs[id].date} (제${logs[id].setNum}장)</div>`).join('');
        });
    }
</script>
</body>
</html>
