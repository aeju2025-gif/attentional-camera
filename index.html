<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 수학 마스터 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-gray: #f2f2f7; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-gray); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; padding: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        
        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 1rem; transition: 0.2s; }
        .btn-student { background: var(--ios-blue); width: 100%; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; margin-bottom: 10px; background: white; }
        
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .problem-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px; position: relative; height: 230px; display: flex; flex-direction: column; box-sizing: border-box; }
        .problem-text { font-size: 1.8rem; font-weight: bold; text-align: right; border-bottom: 2px solid #333; min-width: 80px; line-height: 1; margin-bottom: 5px; }
        .canvas-wrapper { flex: 1; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; touch-action: none; display: block; }
        
        /* 교사용 리스트 및 거대 OX 버튼 */
        .log-item { border: 1px solid #ddd; border-radius: 12px; margin-bottom: 10px; background: white; overflow: hidden; }
        .log-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .time-tag { color: var(--ios-red); font-weight: bold; background: #fff0f0; padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; }
        .log-content { padding: 12px; border-top: 1px solid #eee; display: none; background: #fdfdfd; }
        
        .grade-btn-group { display: flex; gap: 10px; margin-top: 10px; height: 50px; }
        .btn-o { background: var(--ios-green); flex: 1; font-size: 1.5rem; box-shadow: 0 4px 0 #28a745; }
        .btn-x { background: var(--ios-red); flex: 1; font-size: 1.5rem; box-shadow: 0 4px 0 #c82333; }
        .btn-o:active, .btn-x:active { transform: translateY(3px); box-shadow: none; }

        .mark-overlay { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; font-weight: bold; pointer-events: none; z-index: 10; opacity: 0.4; }
        .mark-o { color: var(--ios-green); }
        .mark-x { color: var(--ios-red); }
        
        .hidden { display: none !important; }
        #timerDisplay { font-size: 1.3rem; font-weight: bold; color: var(--ios-red); }
        .set-info { background: #333; color: white; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="loginGate" class="container">
    <h2 style="text-align:center;">🏫 온라인 연산 교실</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <button class="btn btn-student" style="height:120px;" onclick="initStudent()">학생용</button>
        <button class="btn" style="height:120px; background:#5856d6;" onclick="showView('teacherLogin')">교사용</button>
    </div>
</div>

<div id="studentMain" class="container hidden">
    <div style="display:flex; gap:8px; margin-bottom:15px;">
        <div id="tabNew" style="flex:1; padding:12px; text-align:center; background:var(--ios-blue); color:white; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="switchStudentTab('new')">문제 풀기</div>
        <div id="tabWrong" style="flex:1; padding:12px; text-align:center; background:#e5e5ea; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="switchStudentTab('wrong')">오답 노트 (<span id="wrongCount">0</span>)</div>
    </div>
    <div id="newSetup">
        <select id="opMain" onchange="updateSubOptions()">
            <option value="add">덧셈 (+)</option>
            <option value="sub">뺄셈 (-)</option>
        </select>
        <select id="opSub"></select>
        <button class="btn btn-student" onclick="startContinuousQuiz()">5장 연속 학습 시작</button>
    </div>
    <div id="wrongNoteArea" class="hidden">
        <div id="wrongQuizGrid" class="quiz-grid"></div>
        <button class="btn" style="width:100%; margin-top:20px; background:var(--ios-orange); height:60px; font-size:1.2rem;" onclick="submitWrongNote()">오답 노트 제출 완료</button>
    </div>
</div>

<div id="quizSection" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div id="timerDisplay">00:00</div>
        <div id="setIndicator" class="set-info">1 / 5 장</div>
        <button class="btn" style="background:var(--ios-green); padding:8px 20px;" onclick="handleSetSubmit()">제출 / 다음</button>
    </div>
    <div id="quizArea" class="quiz-grid"></div>
</div>

<div id="teacherLogin" class="container hidden">
    <input type="password" id="tPass" placeholder="비밀번호 1234" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px;">
    <button class="btn" style="background:#5856d6; width:100%;" onclick="checkTeacher()">로그인</button>
</div>

<div id="teacherDashboard" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">📋 실시간 제출 목록</h3>
        <button class="btn" style="background:#8e8e93; padding:5px 15px; font-size:0.8rem;" onclick="location.reload()">로그아웃</button>
    </div>
    <div id="logList">목록 로딩 중...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",
        authDomain: "math-98dc8.firebaseapp.com",
        databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com",
        projectId: "math-98dc8",
        storageBucket: "math-98dc8.firebasestorage.app",
        messagingSenderId: "998893080786",
        appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let timer, seconds = 0, currentProblems = [], canvases = [], currentSet = 1;

    const subSteps = {
        add: [{v: "1", t: "받아올림 몇+몇"}, {v: "2", t: "받아올림 몇십몇+몇"}, {v: "3", t: "받아올림 몇십몇+몇십몇"}, {v: "4", t: "받아올림 몇백+몇십몇"}, {v: "5", t: "받아올림 몇백몇십+몇백몇십"}],
        sub: [{v: "1", t: "받아내림 몇십-몇"}, {v: "2", t: "받아내림 몇십몇-몇십몇"}, {v: "3", t: "받아내림 몇백-몇"}, {v: "4", t: "받아내림 몇백몇십-몇십몇"}]
    };

    function showView(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function updateSubOptions() {
        const main = document.getElementById('opMain').value;
        const sub = document.getElementById('opSub');
        sub.innerHTML = subSteps[main].map(s => `<option value="${s.v}">${s.t}</option>`).join('');
    }

    function initStudent() { showView('studentMain'); updateSubOptions(); listenToWrongNotes(); }

    function switchStudentTab(tab) {
        document.getElementById('tabNew').style.background = tab==='new' ? 'var(--ios-blue)' : '#e5e5ea';
        document.getElementById('tabNew').style.color = tab==='new' ? 'white' : 'black';
        document.getElementById('tabWrong').style.background = tab==='wrong' ? 'var(--ios-blue)' : '#e5e5ea';
        document.getElementById('tabWrong').style.color = tab==='wrong' ? 'white' : 'black';
        document.getElementById('newSetup').classList.toggle('hidden', tab !== 'new');
        document.getElementById('wrongNoteArea').classList.toggle('hidden', tab !== 'wrong');
        if(tab === 'wrong') setTimeout(initWrongCanvases, 400);
    }

    function startContinuousQuiz() { currentSet = 1; startQuiz(); }

    function startQuiz() {
        showView('quizSection');
        seconds = 0; 
        document.getElementById('setIndicator').innerText = `${currentSet} / 5 장`;
        const area = document.getElementById('quizArea');
        area.innerHTML = ""; currentProblems = []; canvases = [];
        for(let i=0; i<8; i++) {
            const p = generateProblem();
            currentProblems.push(p);
            createCard(area, p, i, 'c');
        }
        startTimer();
    }

    function generateProblem() {
        const main = document.getElementById('opMain').value;
        const step = document.getElementById('opSub').value;
        let n1, n2;
        if(main === 'add') {
            if(step === "1") { n1 = Math.floor(Math.random()*6)+4; n2 = Math.floor(Math.random()*6)+4; }
            else if(step === "2") { n1 = Math.floor(Math.random()*80)+11; n2 = Math.floor(Math.random()*9)+2; }
            else if(step === "3") { n1 = Math.floor(Math.random()*40)+25; n2 = Math.floor(Math.random()*40)+25; }
            else if(step === "4") { n1 = (Math.floor(Math.random()*8)+1)*100; n2 = Math.floor(Math.random()*80)+11; }
            else { n1 = Math.floor(Math.random()*400)+150; n2 = Math.floor(Math.random()*400)+150; }
            return { n1, n2, op: '+' };
        } else {
            if(step === "1") { n1 = (Math.floor(Math.random()*8)+1)*10; n2 = Math.floor(Math.random()*8)+1; }
            else if(step === "2") { n1 = Math.floor(Math.random()*50)+40; n2 = Math.floor(Math.random()*30)+11; }
            else if(step === "3") { n1 = (Math.floor(Math.random()*8)+1)*100; n2 = Math.floor(Math.random()*8)+1; }
            else { n1 = Math.floor(Math.random()*500)+300; n2 = Math.floor(Math.random()*200)+50; }
            if(n1 < n2) [n1, n2] = [n2, n1];
            return { n1, n2, op: '-' };
        }
    }

    function createCard(target, p, i, prefix) {
        const card = document.createElement('div');
        card.className = 'problem-card';
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between;"><span style="color:#ccc; font-size:0.75rem;">Q${i+1}</span><div class="problem-text">${p.n1}<br>${p.op} ${p.n2}</div></div>
            <div class="canvas-wrapper"><canvas id="${prefix}-canv-${i}"></canvas></div>
            <button onclick="clearCnv('${prefix}-canv-${i}')" style="position:absolute; bottom:8px; left:8px; border:none; background:rgba(0,0,0,0.1); padding:4px 10px; border-radius:5px; font-size:0.7rem; z-index:5;">지우기</button>
        `;
        target.appendChild(card);
        setTimeout(() => setupCanvas(`${prefix}-canv-${i}`), 50);
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        if(!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width; canvas.height = rect.height;
        const ctx = canvas.getContext('2d');
        let drawing = false;

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'pen') { // 애플펜슬만 허용
                e.preventDefault();
                drawing = true;
                ctx.beginPath();
                const p = getPos(e);
                ctx.moveTo(p.x, p.y);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (drawing && e.pointerType === 'pen') {
                e.preventDefault();
                const p = getPos(e);
                ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#007AFF';
                ctx.lineTo(p.x, p.y); ctx.stroke();
            }
        });

        canvas.addEventListener('pointerup', () => drawing = false);
        canvas.addEventListener('pointerleave', () => drawing = false);
        if(id.startsWith('c-canv')) canvases[id.split('-').pop()] = canvas;
    }

    function clearCnv(id) { const c = document.getElementById(id); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }

    function startTimer() {
        if(timer) clearInterval(timer);
        timer = setInterval(() => { seconds++; document.getElementById('timerDisplay').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000);
    }

    function handleSetSubmit() {
        const mainLabel = document.getElementById('opMain').options[document.getElementById('opMain').selectedIndex].text;
        const subLabel = document.getElementById('opSub').options[document.getElementById('opSub').selectedIndex].text;
        const data = {
            date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            timeSpent: document.getElementById('timerDisplay').innerText,
            title: `${mainLabel} (${subLabel})`,
            imgs: canvases.map(c => c ? c.toDataURL() : ""),
            problems: currentProblems,
            grades: new Array(8).fill(null),
            setNum: currentSet
        };
        database.ref('records').push(data).then(() => {
            if(currentSet < 5) {
                currentSet++;
                alert("제출 완료! 다음 장을 시작합니다.");
                startQuiz();
                window.scrollTo(0,0);
            } else {
                alert("축하합니다! 5장을 모두 완료했습니다.");
                location.reload();
            }
        });
    }

    function checkTeacher() {
        if(document.getElementById('tPass').value === "1234") { showView('teacherDashboard'); loadTeacherLogs(); }
        else alert("비밀번호가 틀렸습니다.");
    }

    function loadTeacherLogs() {
        database.ref('records').on('value', (snap) => {
            const logs = snap.val();
            const list = document.getElementById('logList');
            list.innerHTML = ""; if(!logs) { list.innerHTML = "제출된 내역이 없습니다."; return; }
            Object.keys(logs).reverse().forEach(id => {
                const l = logs[id];
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <div class="log-header" onclick="toggleLog('${id}')">
                        <div>
                            <span style="color:#888; font-size:0.8rem;">${l.date}</span><br>
                            <strong>${l.title} (제${l.setNum}장)</strong>
                        </div>
                        <div class="time-tag">⏱ ${l.timeSpent}</div>
                    </div>
                    <div id="content-${id}" class="log-content">
                        <div class="quiz-grid">
                            ${l.problems.map((p, i) => `
                                <div class="problem-card" style="height:210px;">
                                    <div class="problem-text" style="font-size:1.3rem;">${p.n1}<br>${p.op} ${p.n2}</div>
                                    <img src="${l.imgs[i]}" style="width:100%; height:80px; object-fit:contain; background:#f9f9f9; border-radius:8px;">
                                    <div class="grade-btn-group">
                                        <button class="btn btn-o" onclick="gradeOnline('${id}', ${i}, 'O')">O</button>
                                        <button class="btn btn-x" onclick="gradeOnline('${id}', ${i}, 'X')">X</button>
                                    </div>
                                    <div class="mark-overlay ${l.grades && l.grades[i]==='O'?'mark-o':'mark-x'}">${(l.grades && l.grades[i]) || ''}</div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn" style="background:var(--ios-red); width:100%; margin-top:15px; font-size:0.85rem;" onclick="database.ref('records/${id}').remove()">기록 삭제</button>
                    </div>
                `;
                list.appendChild(item);
            });
        });
    }

    function toggleLog(id) {
        const el = document.getElementById(`content-${id}`);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function gradeOnline(rid, idx, status) {
        database.ref(`records/${rid}/grades/${idx}`).set(status);
        if(status === 'X') {
            database.ref(`records/${rid}/problems/${idx}`).once('value', s => {
                database.ref('wrongNotes').push({ problem: s.val() });
            });
        }
    }

    function listenToWrongNotes() {
        database.ref('wrongNotes').on('value', (snap) => {
            const data = snap.val();
            document.getElementById('wrongCount').innerText = data ? Object.keys(data).length : 0;
            const area = document.getElementById('wrongQuizGrid');
            area.innerHTML = ""; if(!data) return;
            Object.keys(data).forEach((id, i) => { createCard(area, data[id].problem, i, 'w'); });
        });
    }

    function initWrongCanvases() {
        document.querySelectorAll('#wrongQuizGrid canvas').forEach(c => setupCanvas(c.id));
    }

    function submitWrongNote() {
        if(confirm("오답 노트를 모두 작성했나요? 제출하면 목록이 초기화됩니다.")) {
            database.ref('wrongNotes').remove().then(() => {
                alert("오답 노트 제출이 완료되었습니다!");
                location.reload();
            });
        }
    }
</script>
</body>
</html>
