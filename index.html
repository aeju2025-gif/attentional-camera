<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>수학 연산 앱</title>

<style>

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#f2f2f7;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

    overscroll-behavior:none;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    position:fixed;
}

*{
    box-sizing:border-box;
}

.hidden{
    display:none !important;
}

.screen{

    width:100%;
    height:100%;

    overflow-y:auto;

    padding:10px;
}

.center{

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:14px;
}

.card{

    background:white;

    border-radius:18px;

    padding:16px;

    box-shadow:
    0 2px 8px
    rgba(0,0,0,0.08);
}

.big-button{

    width:260px;

    padding:18px;

    border:none;

    border-radius:18px;

    background:#007AFF;

    color:white;

    font-size:24px;

    font-weight:400;
}

button,
select{

    font-size:16px;

    padding:10px;

    border-radius:12px;

    border:none;
}

button{

    background:#007AFF;

    color:white;

    touch-action:manipulation;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-bottom:10px;
}

.timer{

    position:fixed;

    top:10px;
    left:10px;

    z-index:999;

    background:black;

    color:white;

    padding:8px 14px;

    border-radius:10px;

    font-size:18px;
}

.problem-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;
}

.problem-box{

    background:white;

    border-radius:14px;

    padding:8px;

    position:relative;

    box-shadow:
    0 1px 5px
    rgba(0,0,0,0.08);

    touch-action:none;
}

.problem{
    text-align:center;
    margin-bottom:4px;
}

.horizontal-problem{

    font-size:30px;

    font-weight:300;
}

.vertical-problem{

    display:inline-block;

    text-align:right;

    font-size:30px;

    line-height:1.1;

    font-family:monospace;

    font-weight:300;
}

.vertical-line{

    border-top:2px solid black;

    margin-top:2px;
}

canvas{

    width:100%;

    height:135px;

    background:white;

    border:1px solid #ccc;

    border-radius:10px;

    display:block;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;
}

.erase-btn{

    background:#666;

    font-size:12px;

    padding:4px 8px;

    border-radius:8px;
}

.result-mark{

    position:absolute;

    top:5px;
    right:8px;

    font-size:28px;

    font-weight:700;
}

.result-o{
    color:green;
}

.result-x{
    color:red;
}

.test-item{

    background:white;

    padding:14px;

    border-radius:14px;

    margin-bottom:10px;

    box-shadow:
    0 1px 5px
    rgba(0,0,0,0.08);
}

</style>
</head>

<body>

<div id="timer"
class="timer hidden">
00:00
</div>


<!-- 시작 -->
<div id="startScreen"
class="screen center">

<h1 style="font-weight:400;">
수학 연산 앱
</h1>

<button class="big-button"
onclick="showStudentSetup()">
학생용
</button>

<button class="big-button"
onclick="showTeacherScreen()">
교사용
</button>

</div>



<!-- 설정 -->
<div id="studentSetup"
class="screen hidden">

<div class="card">

<h2 style="font-weight:400;">
문제 설정
</h2>

<br>

<select id="operationType">

<option value="add">
덧셈
</option>

<option value="sub">
뺄셈
</option>

</select>

<br><br>

<select id="digitType">

<option value="1_1">
한자리 + 한자리
</option>

<option value="2_1">
두자리 + 한자리
</option>

<option value="2_2">
두자리 + 두자리
</option>

<option value="3_1">
세자리 + 한자리
</option>

<option value="3_2">
세자리 + 두자리
</option>

<option value="3_3">
세자리 + 세자리
</option>

</select>

<br><br>

<select id="layoutType">

<option value="vertical">
세로셈
</option>

<option value="horizontal">
가로셈
</option>

</select>

<br><br>

<select id="sheetCount">

<option value="5">
5장
</option>

<option value="10">
10장
</option>

</select>

<br><br>

<button onclick="startStudentMode()">
시작하기
</button>

<br>

<button
style="
background:#ff9500;
"

onclick="openRetryMode()">

오답노트 풀기

</button>

</div>

</div>



<!-- 학생 -->
<div id="studentScreen"
class="screen hidden">

<div class="top-bar">

<h2 id="sheetInfo"
style="
font-weight:400;
font-size:18px;
">
</h2>

<button onclick="submitWorksheet()">
제출
</button>

</div>


<div id="problemGrid"
class="problem-grid">
</div>

</div>



<!-- 교사 -->
<div id="teacherScreen"
class="screen hidden">

<div class="top-bar">

<h2 style="font-weight:400;">
채점 목록
</h2>

<button onclick="goHome()">
홈
</button>

</div>

<div id="submissionList"></div>

</div>



<!-- 채점 -->
<div id="gradingScreen"
class="screen hidden">

<div class="top-bar">

<h2 id="gradingTitle"
style="font-weight:400;">
</h2>

<button onclick="backToTeacher()">
뒤로
</button>

</div>

<div id="gradingGrid"
class="problem-grid">
</div>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getDatabase,
ref,
push,
set,
onValue,
update

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey:
"AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",

authDomain:
"math-98dc8.firebaseapp.com",

databaseURL:
"https://math-98dc8-default-rtdb.firebaseio.com",

projectId:
"math-98dc8",

storageBucket:
"math-98dc8.firebasestorage.app",

messagingSenderId:
"998893080786",

appId:
"1:998893080786:web:fc2ce7af37e3bd0cd85d0b",

measurementId:
"G-TC28EDFTWR"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);



// 상태
let startTime = 0;

let timerInterval;

let problems = [];

let canvases = [];

let retryProblems = [];

let currentSheet = 1;

let totalSheets = 5;

let retryMode = false;



// 화면
const startScreen =
document.getElementById(
"startScreen"
);

const studentSetup =
document.getElementById(
"studentSetup"
);

const studentScreen =
document.getElementById(
"studentScreen"
);

const teacherScreen =
document.getElementById(
"teacherScreen"
);

const gradingScreen =
document.getElementById(
"gradingScreen"
);



// 숨기기
function hideAll(){

startScreen.classList.add("hidden");

studentSetup.classList.add("hidden");

studentScreen.classList.add("hidden");

teacherScreen.classList.add("hidden");

gradingScreen.classList.add("hidden");
}



// 시작화면
window.showStudentSetup =
function(){

hideAll();

studentSetup.classList.remove(
"hidden"
);

listenRetry();
}


window.showTeacherScreen =
function(){

hideAll();

teacherScreen.classList.remove(
"hidden"
);

loadSubmissionList();
}


window.goHome =
function(){

hideAll();

document
.getElementById("timer")
.classList.add("hidden");

startScreen.classList.remove(
"hidden"
);
}


window.backToTeacher =
function(){

hideAll();

teacherScreen.classList.remove(
"hidden"
);
}



// 학생 시작
window.startStudentMode =
function(){

retryMode = false;

currentSheet = 1;

totalSheets =
Number(
document.getElementById(
"sheetCount"
).value
);

startWorksheet();
};



// 오답노트 시작
window.openRetryMode =
function(){

retryMode = true;

hideAll();

studentScreen.classList.remove(
"hidden"
);

document
.getElementById("timer")
.classList.add("hidden");

document
.getElementById("sheetInfo")
.innerText =
"오답노트";

generateRetryWorksheet();
};



// 시험 시작
function startWorksheet(){

hideAll();

studentScreen.classList.remove(
"hidden"
);

document
.getElementById("timer")
.classList.remove("hidden");

document
.getElementById("sheetInfo")
.innerText =
`${currentSheet}
/
${totalSheets} 장`;

startTime =
Date.now();

startTimer();

generateWorksheet();
}



// 타이머
function startTimer(){

clearInterval(
timerInterval
);

timerInterval =
setInterval(()=>{

const sec =
Math.floor(
(Date.now()-startTime)
/1000
);

const min =
String(
Math.floor(sec/60)
).padStart(2,"0");

const s =
String(sec%60)
.padStart(2,"0");

document
.getElementById("timer")
.innerText =
`${min}:${s}`;

},1000);
}



// 랜덤
function randomDigits(d){

if(d===1){

return Math.floor(
Math.random()*9
)+1;
}

if(d===2){

return Math.floor(
Math.random()*90
)+10;
}

return Math.floor(
Math.random()*900
)+100;
}



// 문제 생성
function generateWorksheet(){

problems = [];

canvases = [];

const grid =
document.getElementById(
"problemGrid"
);

grid.innerHTML = "";

const op =
document.getElementById(
"operationType"
).value;

const digit =
document.getElementById(
"digitType"
).value;

const layout =
document.getElementById(
"layoutType"
).value;

const parts =
digit.split("_");

const d1 =
Number(parts[0]);

const d2 =
Number(parts[1]);



for(let i=0;i<8;i++){

let a,b,answer;

while(true){

a = randomDigits(d1);

b = randomDigits(d2);

if(op==="add"){

const onesA = a % 10;
const onesB = b % 10;

if(onesA + onesB >= 10){

answer = a+b;

break;
}

}else{

if(a>=b){

answer = a-b;

break;
}
}
}

problems.push({
a,b,answer,op
});

createProblemBox(
grid,
i,
a,
b,
op,
layout
);

}
}



// 오답문제 생성
function generateRetryWorksheet(){

problems = [];

canvases = [];

const grid =
document.getElementById(
"problemGrid"
);

grid.innerHTML = "";

if(retryProblems.length===0){

grid.innerHTML =
`
<div class="card">

오답 문제가 없습니다

</div>
`;

return;
}

retryProblems.forEach(
(p,index)=>{

problems.push(p);

createProblemBox(
grid,
index,
p.a,
p.b,
p.op,
"horizontal"
);

});
}



// 문제 박스
function createProblemBox(
grid,
index,
a,
b,
op,
layout
){

const div =
document.createElement("div");

div.className =
"problem-box";

let html = "";

if(layout==="vertical"){

html =
`
<div class="vertical-problem">

<div>
${String(a).padStart(3," ")}
</div>

<div>
${op==="add"
?"+":"-"}

${String(b).padStart(3," ")}
</div>

<div class="vertical-line"></div>

</div>
`;

}else{

html =
`
<div class="horizontal-problem">

${a}

${op==="add"
?"+":"-"}

${b}

=

</div>
`;
}



div.innerHTML =
`
<div class="problem">
${html}
</div>

<div style="
display:flex;
justify-content:flex-end;
margin-bottom:4px;
">

<button
class="erase-btn">

지우기

</button>

</div>

<canvas
id="canvas${index}">
</canvas>
`;

grid.appendChild(div);

setupCanvas(`canvas${index}`);



const eraseBtn =
div.querySelector(
".erase-btn"
);

eraseBtn.addEventListener(
"pointerdown",
(e)=>{

e.preventDefault();

e.stopPropagation();

clearOneCanvas(index);

},
{passive:false}
);
}



// 지우기
function clearOneCanvas(index){

const canvas =
canvases[index];

if(!canvas) return;

const ctx =
canvas.getContext("2d");

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);
}



// 캔버스
function setupCanvas(id){

const canvas =
document.getElementById(id);

const ctx =
canvas.getContext("2d");

canvas.width =
canvas.offsetWidth;

canvas.height = 135;

ctx.lineWidth = 2.5;

ctx.lineCap = "round";

ctx.lineJoin = "round";

ctx.strokeStyle = "black";

let drawing = false;



function pos(e){

const rect =
canvas.getBoundingClientRect();

return {

x:e.clientX - rect.left,

y:e.clientY - rect.top
};
}



function stopEvent(e){

e.preventDefault();

e.stopPropagation();
}



// 시작
canvas.addEventListener(
"pointerdown",
(e)=>{

stopEvent(e);

if(
e.pointerType !== "pen"
){
return;
}

drawing = true;

const p = pos(e);

ctx.beginPath();

ctx.moveTo(p.x,p.y);

},
{passive:false}
);



// 이동
canvas.addEventListener(
"pointermove",
(e)=>{

if(!drawing) return;

stopEvent(e);

const p = pos(e);

ctx.lineTo(p.x,p.y);

ctx.stroke();

},
{passive:false}
);



// 종료
canvas.addEventListener(
"pointerup",
(e)=>{

stopEvent(e);

drawing = false;

},
{passive:false}
);


canvas.addEventListener(
"pointerleave",
(e)=>{

stopEvent(e);

drawing = false;

},
{passive:false}
);


canvas.addEventListener(
"pointercancel",
(e)=>{

stopEvent(e);

drawing = false;

},
{passive:false}
);



// 방지
canvas.addEventListener(
"contextmenu",
(e)=>{
stopEvent(e);
}
);

canvas.addEventListener(
"dragstart",
(e)=>{
stopEvent(e);
}
);

canvases.push(canvas);
}



// 제출
window.submitWorksheet =
async function(){

clearInterval(
timerInterval
);

const sec =
retryMode
? 0
: Math.floor(
(Date.now()-startTime)
/1000
);

const images =
canvases.map(
c=>c.toDataURL()
);

const now =
new Date();

const title =
retryMode
? "오답노트"
:
`${now.getFullYear()}-${
String(
now.getMonth()+1
).padStart(2,"0")
}-${
String(
now.getDate()
).padStart(2,"0")
}
${
String(
now.getHours()
).padStart(2,"0")
}:${
String(
now.getMinutes()
).padStart(2,"0")
}`;

const submitRef =
push(
ref(db,"submissions")
);

await set(
submitRef,
{
title,
time:sec,
problems,
images,
results:[],
checked:false
}
);


if(retryMode){

alert("오답노트 제출 완료");

goHome();

return;
}


if(currentSheet < totalSheets){

currentSheet++;

startWorksheet();

}else{

alert("완료");

goHome();
}
};



// 제출목록
function loadSubmissionList(){

const list =
document.getElementById(
"submissionList"
);

onValue(
ref(db,"submissions"),

(snapshot)=>{

const data =
snapshot.val();

list.innerHTML = "";

if(!data){

list.innerHTML =
"제출 없음";

return;
}

Object.entries(data)
.reverse()
.forEach(([key,item])=>{

const div =
document.createElement("div");

div.className =
"test-item";

div.innerHTML =
`
<div>

${item.title}

</div>

<div style="
margin-top:6px;
font-size:14px;
">

풀이 시간:
${item.time}초

</div>

<button
style="margin-top:10px"

onclick="
openGrading(
'${key}'
)
">

채점하기

</button>
`;

list.appendChild(div);
});
});
}



// 채점화면
window.openGrading =
function(key){

hideAll();

gradingScreen
.classList.remove("hidden");

const grid =
document.getElementById(
"gradingGrid"
);

onValue(
ref(
db,
`submissions/${key}`
),

(snapshot)=>{

const item =
snapshot.val();

document
.getElementById(
"gradingTitle"
)
.innerText =
item.title;

grid.innerHTML = "";

item.problems
.forEach((p,index)=>{

const div =
document.createElement("div");

div.className =
"problem-box";

const result =
item.results?.[index];

let mark = "";

if(result===true){

mark =
`
<div class="
result-mark
result-o
">
O
</div>
`;

}else if(result===false){

mark =
`
<div class="
result-mark
result-x
">
X
</div>
`;
}


div.innerHTML =
`
${mark}

<div class="
horizontal-problem
">

${p.a}

${p.op==="add"
?"+":"-"}

${p.b}

</div>

<img
src="${item.images[index]}"
style="
width:100%;
margin-top:6px;
border-radius:10px;
border:1px solid #ccc;
">

<div style="
display:flex;
gap:6px;
margin-top:6px;
">

<button
style="background:green"

onclick="
gradeSubmission(
'${key}',
${index},
true
)
">

O

</button>

<button
style="background:red"

onclick="
gradeSubmission(
'${key}',
${index},
false
)
">

X

</button>

</div>
`;

grid.appendChild(div);
});
});
};



// 채점
window.gradeSubmission =
async function(
key,
index,
result
){

const target =
ref(
db,
`submissions/${key}`
);

onValue(
target,

async(snapshot)=>{

const data =
snapshot.val();

const results =
data.results || [];

results[index] =
result;

await update(
target,
{
checked:true,
results
}
);

listenRetry();

},

{onlyOnce:true}
);
};



// 오답목록
function listenRetry(){

onValue(
ref(db,"submissions"),

(snapshot)=>{

const data =
snapshot.val();

retryProblems = [];

if(!data) return;

Object.values(data)
.forEach(item=>{

if(!item.checked)
return;

item.results?.forEach(
(r,index)=>{

if(r===false){

retryProblems.push(
item.problems[index]
);
}
});
});

},
{onlyOnce:true}
);
}

</script>

</body>
</html>
