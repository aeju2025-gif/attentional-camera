<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 수학 마스터</title>
    <!-- Firebase SDK 로드 (호환성 모드) -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-gray: #f2f2f7; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-gray); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; background: white; border-radius: 24px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .btn { padding: 15px 25px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 1rem; transition: 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-student { background: var(--ios-blue); width: 100%; }
        .btn-teacher { background: #5856d6; width: 100%; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 15px; text-align: center; background: #e5e5ea; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .tab.active { background: var(--ios-blue); color: white; }

        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .problem-card { background: #fff; border: 1px solid #ddd; border-radius: 18px; padding: 12px; position: relative; height: 240px; display: flex; flex-direction: column; }
        .problem-text { font-size: 2.2rem; font-weight: bold; text-align: right; border-bottom: 3px solid #333; width: 110px; margin-left: auto; margin-bottom: 5px; line-height: 1.1; }
        .canvas-wrapper { flex-grow: 1; background: #fdfdfd; border-radius: 12px; border: 1px solid #efeff4; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; touch-action: none; }

        .mark-overlay { position: absolute; top: 10px; left: 15px; font-size: 4rem; font-weight: bold; pointer-events: none; z-index: 10; }
        .mark-o { color: rgba(52, 199, 89, 0.6); }
        .mark-x { color: rgba(255, 59, 48, 0.6); }

        .hidden { display: none !important; }
        #timerDisplay { font-size: 1.5rem; font-weight: bold; color: var(--ios-red); }
    </style>
</head>
<body>

<div id="loginGate" class="container">
    <h1 style="text-align:center; margin-bottom:30px;">🏫 온라인 연산 교실</h1>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
        <button class="btn btn-student" style="height:150px;" onclick="initStudent()">학생용<br>(공부 시작)</button>
        <button class="btn btn-teacher" style="height:150px;" onclick="showView('teacherLogin')">교사용<br>(채점 하기)</button>
    </div>
</div>

<!-- 학생 메인 화면 -->
<div id="studentMain" class="container hidden">
    <div class="tab-menu">
        <div id="tabNew" class="tab active" onclick="switchStudentTab('new')">🆕 오늘의 문제</div>
        <div id="tabWrong" class="tab" onclick="switchStudentTab('wrong')">🖍 오답 노트 (<span id="wrongCount">0</span>)</div>
    </div>

    <div id="newSetup">
        <div style="margin-bottom:15px;">
            <label style="font-weight:bold;">연산 선택</label>
            <select id="opMain" onchange="updateSubOptions()" style="width:100%; padding:15px; border-radius:10px; font-size:1rem;"></select>
        </div>
        <div style="margin-bottom:25px;">
            <label style="font-weight:bold;">단계 선택</label>
            <select id="opSub" style="width:100%; padding:15px; border-radius:10px; font-size:1rem;"></select>
        </div>
        <button class="btn btn-student" onclick="startQuiz()">문제 생성하기</button>
    </div>

    <div id="wrongNoteArea" class="hidden">
        <div id="wrongQuizGrid" class="quiz-grid"></div>
        <button id="submitWrongBtn" class="btn" style="width:100%; margin-top:20px; background:var(--ios-orange);" onclick="submitFullQuiz(true)">오답 노트 제출</button>
    </div>
</div>

<!-- 문제 풀이 섹션 -->
<div id="quizSection" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div id="timerDisplay">00:00</div>
        <button class="btn" style="background:var(--ios-green);" onclick="submitFullQuiz(false)">제출 완료</button>
    </div>
    <div id="quizArea" class="quiz-grid"></div>
</div>

<!-- 교사 모드 -->
<div id="teacherLogin" class="container hidden">
    <h2 style="text-align:center;">교사용 로그인</h2>
    <input type="password" id="tPass" placeholder="비밀번호 1234" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:10px;">
    <button class="btn btn-teacher" onclick="checkTeacher()">로그인</button>
</div>

<div id="teacherDashboard" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>제출 현황</h2>
        <button class="btn" style="background:#8e8e93; padding:8px 15px;" onclick="location.reload()">나가기</button>
    </div>
    <div id="logList"></div>
</div>

<script>
    // [Firebase 설정 적용]
    const firebaseConfig = {
        apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",
        authDomain: "math-98dc8.firebaseapp.com",
        databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com",
        projectId: "math-98dc8",
        storageBucket: "math-98dc8.firebasestorage.app",
        messagingSenderId: "998893080786",
        appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b",
        measurementId: "G-TC28EDFTWR"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let timer, seconds = 0, currentProblems = [], canvases = [];

    const optMap = {
        add: [
            {v: "1", t: "1. 받아올림 몇+몇"}, {v: "2", t: "2. 받아올림 몇십몇+몇"},
            {v: "3", t: "3. 받아올림 몇십몇+몇십몇"}, {v: "4", t: "4. 받아올림 몇백+몇십몇"}, {v: "5", t: "5. 받아올림 몇백+몇백"}
        ],
        sub: [
            {v: "1", t: "1. 받아내림 몇십-몇"}, {v: "2", t: "2. 받아내림 몇십몇-몇십몇"},
            {v: "3", t: "3. 받아내림 몇백-몇"}, {v: "4", t: "4. 받아내림 몇백몇십-몇십몇"}
        ]
    };

    function showView(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function updateSubOptions() {
        const main = document.getElementById('opMain');
        if(!main.innerHTML) main.innerHTML = '<option value="add">덧셈 (+)</option><option value="sub">뺄셈 (-)</option>';
        const sub = document.getElementById('opSub');
        sub.innerHTML = optMap[main.value].map(o => `<option value="${o.v}">${o.t}</option>`).join('');
    }

    function initStudent() {
        showView('studentMain');
        updateSubOptions();
        listenToWrongNotes();
    }

    function switchStudentTab(tab) {
        document.getElementById('tabNew').className = 'tab ' + (tab === 'new' ? 'active' : '');
        document.getElementById('tabWrong').className = 'tab ' + (tab === 'wrong' ? 'active' : '');
        document.getElementById('newSetup').classList.toggle('hidden', tab !== 'new');
        document.getElementById('wrongNoteArea').classList.toggle('hidden', tab !== 'wrong');
    }

    function listenToWrongNotes() {
        database.ref('wrongNotes').on('value', (snapshot) => {
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 0;
            document.getElementById('wrongCount').innerText = count;
            renderWrongNoteArea(data);
        });
    }

    function startQuiz() {
        showView('quizSection');
        const area = document.getElementById('quizArea');
        area.innerHTML = "";
        currentProblems = []; canvases = [];

        for(let i=0; i<8; i++) {
            const p = generateProblem();
            currentProblems.push(p);
            createCard(area, p, i, false);
        }
        startTimer();
    }

    function generateProblem() {
        const main = document.getElementById('opMain').value;
        return { n1: Math.floor(Math.random()*80)+11, n2: Math.floor(Math.random()*9)+2, op: main === 'add' ? '+' : '-' };
    }

    function createCard(target, p, i, isWrong) {
        const card = document.createElement('div');
        card.className = 'problem-card';
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <span style="color:#8e8e93; font-weight:bold;">Q${i+1}</span>
                <div class="problem-text">${p.n1}<br>${p.op} ${p.n2}</div>
            </div>
            <div class="canvas-wrapper"><canvas id="${isWrong?'w':'c'}-canv-${i}"></canvas></div>
            <button onclick="clearCnv(${i})" style="position:absolute; bottom:8px; left:8px; border:none; background:#eee; border-radius:5px; font-size:11px; padding:4px 8px;">싹 지우기</button>
        `;
        target.appendChild(card);
        setTimeout(() => setupCanvas(`${isWrong?'w':'c'}-canv-${i}`, i), 100);
    }

    function setupCanvas(id, i) {
        const canvas = document.getElementById(id);
        if(!canvas) return;
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const ctx = canvas.getContext('2d');
        canvases[i] = canvas;
        let drawing = false;
        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        };
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }, {passive:false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(!drawing) return; const p = getPos(e); ctx.lineWidth=3; ctx.lineCap='round'; ctx.strokeStyle='#007AFF'; ctx.lineTo(p.x, p.y); ctx.stroke(); }, {passive:false});
        canvas.addEventListener('touchend', () => drawing = false);
    }

    function clearCnv(i) { 
        const ctx = canvases[i].getContext('2d');
        ctx.clearRect(0,0,canvases[i].width,canvases[i].height);
    }

    function startTimer() {
        seconds = 0;
        if(timer) clearInterval(timer);
        timer = setInterval(() => {
            seconds++;
            document.getElementById('timerDisplay').innerText = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
        }, 1000);
    }

    function submitFullQuiz(isWrongNote) {
        const data = {
            date: new Date().toLocaleString(),
            time: document.getElementById('timerDisplay').innerText,
            imgs: canvases.map(c => c.toDataURL()),
            problems: currentProblems,
            grades: new Array(currentProblems.length).fill(null)
        };
        
        const refName = isWrongNote ? 'wrongSubmissions' : 'records';
        database.ref(refName).push(data).then(() => {
            if(isWrongNote) database.ref('wrongNotes').remove(); // 오답노트 제출시 비우기
            alert("선생님께 제출되었습니다!");
            location.reload();
        });
    }

    // --- 교사 모드 ---
    function checkTeacher() {
        if(document.getElementById('tPass').value === "1234") {
            showView('teacherDashboard');
            loadTeacherLogs();
        } else { alert("비밀번호가 틀렸습니다."); }
    }

    function loadTeacherLogs() {
        database.ref('records').on('value', (snapshot) => {
            const logs = snapshot.val();
            const list = document.getElementById('logList');
            list.innerHTML = "";
            if(!logs) { list.innerHTML = "<p>아직 제출된 기록이 없습니다.</p>"; return; }
            Object.keys(logs).reverse().forEach(id => {
                const l = logs[id];
                const item = document.createElement('div');
                item.style.marginBottom = "50px";
                item.innerHTML = `
                    <h3 style="border-left:5px solid var(--ios-blue); padding-left:10px;">제출: ${l.date} (${l.time})</h3>
                    <div class="quiz-grid">
                        ${l.problems.map((p, i) => `
                            <div class="problem-card">
                                <div class="problem-text">${p.n1}<br>${p.op} ${p.n2}</div>
                                <img src="${l.imgs[i]}" style="width:100%; height:130px; object-fit:contain; background:#f9f9f9; border-radius:10px;">
                                <div style="display:flex; gap:10px; margin-top:10px;">
                                    <button class="btn" style="background:var(--ios-green); flex:1; padding:10px;" onclick="gradeOnline('${id}', ${i}, 'O')">O</button>
                                    <button class="btn" style="background:var(--ios-red); flex:1; padding:10px;" onclick="gradeOnline('${id}', ${i}, 'X')">X</button>
                                </div>
                                <div class="mark-overlay ${l.grades[i]==='O'?'mark-o':'mark-x'}">${l.grades[i]||''}</div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn" style="background:#ff3b30; width:100%; margin-top:10px; padding:10px;" onclick="deleteRecord('${id}')">기록 삭제</button>
                `;
                list.appendChild(item);
            });
        });
    }

    function gradeOnline(recordId, index, status) {
        database.ref(`records/${recordId}/grades/${index}`).set(status);
        if(status === 'X') {
            database.ref(`records/${recordId}`).once('value').then(snap => {
                const d = snap.val();
                database.ref('wrongNotes').push({
                    problem: d.problems[index],
                    oldImg: d.imgs[index]
                });
            });
        }
    }

    function deleteRecord(id) { if(confirm("정말 삭제하시겠습니까?")) database.ref(`records/${id}`).remove(); }

    function renderWrongNoteArea(data) {
        const area = document.getElementById('wrongQuizGrid');
        area.innerHTML = "";
        if(!data) { area.innerHTML = "<p style='grid-column:span 2; text-align:center; padding:50px;'>오답이 없습니다! 잘했어요!</p>"; return; }
        currentProblems = [];
        canvases = [];
        Object.keys(data).forEach((id, i) => {
            const w = data[id];
            currentProblems.push(w.problem);
            createCard(area, w.problem, i, true);
        });
    }
</script>
</body>
</html>
