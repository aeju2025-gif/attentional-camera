
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<title>수학 연산 앱</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f2f2f7;
    color:#111;
}

.hidden{
    display:none !important;
}

.screen{
    min-height:100vh;
    padding:8px;
}

.center{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:14px;
}

.big-button{
    width:260px;
    padding:18px;
    border:none;
    border-radius:16px;
    background:#007AFF;
    color:white;
    font-size:24px;
    font-weight:500;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

input, select, button{
    font-size:16px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    background:#007AFF;
    color:white;
    border:none;
    font-weight:500;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.timer{
    position:fixed;
    top:8px;
    left:8px;
    background:black;
    color:white;
    padding:8px 14px;
    border-radius:10px;
    font-size:18px;
    z-index:1000;
}

.problem-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.problem-box{
    background:white;
    border-radius:14px;
    padding:6px;
    box-shadow:0 1px 5px rgba(0,0,0,0.08);
}

.problem{
    text-align:center;
    margin-bottom:4px;
    font-weight:500;
}

.vertical-problem{
    display:inline-block;
    text-align:right;
    font-size:22px;
    line-height:1.2;
    font-family:monospace;
}

.vertical-line{
    border-top:2px solid black;
    margin-top:2px;
    padding-top:2px;
}

.horizontal-problem{
    font-size:22px;
}

canvas{
    width:100%;
    height:120px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    touch-action:none;
    display:block;
}

.submission-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.submission-box{
    background:white;
    border-radius:14px;
    padding:6px;
    box-shadow:0 1px 5px rgba(0,0,0,0.08);
}

.submission-box img{
    width:100%;
    border:1px solid #ccc;
    border-radius:8px;
    margin-top:4px;
}

.ox-buttons{
    display:flex;
    gap:6px;
    margin-top:4px;
}

.correct{
    background:green;
}

.wrong{
    background:red;
}

.retry-box{
    background:#fff3cd;
    border-radius:12px;
    padding:10px;
    margin-top:10px;
    font-size:15px;
}

.teacher-info{
    margin-bottom:8px;
    font-size:15px;
}

</style>
</head>

<body>

<div id="timer" class="timer hidden">
00:00
</div>

<!-- 시작 -->
<div id="startScreen" class="screen center">

    <h1 style="font-size:32px;font-weight:500;">
        수학 연산 앱
    </h1>

    <button class="big-button"
    onclick="showStudentSetup()">
        학생용
    </button>

    <button class="big-button"
    onclick="showTeacherScreen()">
        교사용
    </button>

</div>


<!-- 학생 설정 -->
<div id="studentSetup"
class="screen hidden">

    <div class="card">

        <h2 style="font-weight:500;">
            문제 설정
        </h2>

        <br>

        <select id="operationType">

            <option value="add">
                덧셈
            </option>

            <option value="sub">
                뺄셈
            </option>

        </select>

        <br><br>

        <select id="digitType">

            <option value="1_1">
                한자리 + 한자리
            </option>

            <option value="2_1">
                두자리 + 한자리
            </option>

            <option value="2_2">
                두자리 + 두자리
            </option>

            <option value="3_1">
                세자리 + 한자리
            </option>

            <option value="3_2">
                세자리 + 두자리
            </option>

            <option value="3_3">
                세자리 + 세자리
            </option>

        </select>

        <br><br>

        <select id="layoutType">

            <option value="vertical">
                세로셈
            </option>

            <option value="horizontal">
                가로셈
            </option>

        </select>

        <br><br>

        <button onclick="startStudentMode()">
            시작하기
        </button>

    </div>

</div>


<!-- 학생 화면 -->
<div id="studentScreen"
class="screen hidden">

    <div class="top-bar">

        <h2 style="font-size:20px;font-weight:500;">
            문제 풀기
        </h2>

        <button onclick="submitWorksheet()">
            제출
        </button>

    </div>

    <div id="problemGrid"
    class="problem-grid"></div>

    <div id="retryArea"></div>

</div>


<!-- 교사 화면 -->
<div id="teacherScreen"
class="screen hidden">

    <div class="top-bar">

        <h2 style="font-size:20px;font-weight:500;">
            교사 채점
        </h2>

        <button onclick="goHome()">
            홈
        </button>

    </div>

    <div id="submissionList"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// Firebase
const firebaseConfig = {

    apiKey:"AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",

    authDomain:"math-98dc8.firebaseapp.com",

    databaseURL:
    "https://math-98dc8-default-rtdb.firebaseio.com",

    projectId:"math-98dc8",

    storageBucket:
    "math-98dc8.firebasestorage.app",

    messagingSenderId:"998893080786",

    appId:
    "1:998893080786:web:fc2ce7af37e3bd0cd85d0b",

    measurementId:"G-TC28EDFTWR"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// 화면
const startScreen =
document.getElementById("startScreen");

const studentSetup =
document.getElementById("studentSetup");

const studentScreen =
document.getElementById("studentScreen");

const teacherScreen =
document.getElementById("teacherScreen");


// 상태
let startTime = 0;
let timerInterval;
let problems = [];
let canvases = [];


// 화면전환
function hideAll(){

    startScreen.classList.add("hidden");
    studentSetup.classList.add("hidden");
    studentScreen.classList.add("hidden");
    teacherScreen.classList.add("hidden");
}

window.showStudentSetup = function(){

    hideAll();

    studentSetup.classList.remove("hidden");
}

window.showTeacherScreen = function(){

    hideAll();

    teacherScreen.classList.remove("hidden");

    loadSubmissions();
}

window.goHome = function(){

    hideAll();

    startScreen.classList.remove("hidden");
}


// 학생 시작
window.startStudentMode = function(){

    hideAll();

    studentScreen.classList.remove("hidden");

    document.getElementById("timer")
        .classList.remove("hidden");

    startTime = Date.now();

    startTimer();

    generateWorksheet();

    listenRetry();
}


// 타이머
function startTimer(){

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{

        const sec =
        Math.floor((Date.now()-startTime)/1000);

        const min =
        String(Math.floor(sec/60)).padStart(2,"0");

        const s =
        String(sec%60).padStart(2,"0");

        document.getElementById("timer")
        .innerText = `${min}:${s}`;

    },1000);
}


// 숫자 생성
function randomDigits(d){

    if(d===1)
        return Math.floor(Math.random()*9)+1;

    if(d===2)
        return Math.floor(Math.random()*90)+10;

    return Math.floor(Math.random()*900)+100;
}


// 문제 생성
function generateWorksheet(){

    problems = [];
    canvases = [];

    const grid =
    document.getElementById("problemGrid");

    grid.innerHTML = "";

    const op =
    document.getElementById("operationType").value;

    const digit =
    document.getElementById("digitType").value;

    const layout =
    document.getElementById("layoutType").value;

    const parts = digit.split("_");

    const d1 = Number(parts[0]);
    const d2 = Number(parts[1]);

    for(let i=0;i<8;i++){

        let a,b,answer;

        while(true){

            a = randomDigits(d1);
            b = randomDigits(d2);

            if(op==="add"){

                answer = a+b;
                break;

            }else{

                if(a>=b){

                    answer = a-b;
                    break;
                }
            }
        }

        problems.push({
            a,b,answer,op
        });

        const div =
        document.createElement("div");

        div.className = "problem-box";

        let problemHTML = "";

        if(layout==="vertical"){

            const top =
            String(a).padStart(3," ");

            const bottom =
            String(b).padStart(3," ");

            problemHTML =
            `
            <div class="vertical-problem">

                <div>${top}</div>

                <div>
                ${op==="add"?"+":"-"}
                ${bottom}
                </div>

                <div class="vertical-line"></div>

            </div>
            `;

        }else{

            problemHTML =
            `
            <div class="horizontal-problem">
            ${a}
            ${op==="add"?"+":"-"}
            ${b}
            =
            </div>
            `;
        }

        div.innerHTML =
        `
        <div class="problem">
            ${problemHTML}
        </div>

        <canvas id="canvas${i}">
        </canvas>
        `;

        grid.appendChild(div);

        setupCanvas(`canvas${i}`);
    }
}


// 캔버스
function setupCanvas(id){

    const canvas =
    document.getElementById(id);

    const ctx =
    canvas.getContext("2d");

    canvas.width =
    canvas.offsetWidth;

    canvas.height = 120;

    ctx.lineWidth = 4;
    ctx.lineCap = "round";

    let drawing = false;

    function pos(e){

        const rect =
        canvas.getBoundingClientRect();

        if(e.touches){

            return {

                x:e.touches[0].clientX
                - rect.left,

                y:e.touches[0].clientY
                - rect.top
            };
        }

        return {

            x:e.clientX - rect.left,

            y:e.clientY - rect.top
        };
    }

    canvas.addEventListener("mousedown",(e)=>{

        drawing = true;

        const p = pos(e);

        ctx.beginPath();

        ctx.moveTo(p.x,p.y);
    });

    canvas.addEventListener("mousemove",(e)=>{

        if(!drawing) return;

        const p = pos(e);

        ctx.lineTo(p.x,p.y);

        ctx.stroke();
    });

    canvas.addEventListener("mouseup",()=>{

        drawing=false;
    });

    canvas.addEventListener("touchstart",(e)=>{

        drawing=true;

        const p=pos(e);

        ctx.beginPath();

        ctx.moveTo(p.x,p.y);
    });

    canvas.addEventListener("touchmove",(e)=>{

        e.preventDefault();

        if(!drawing) return;

        const p=pos(e);

        ctx.lineTo(p.x,p.y);

        ctx.stroke();
    });

    canvas.addEventListener("touchend",()=>{

        drawing=false;
    });

    canvases.push(canvas);
}


// 제출
window.submitWorksheet = async function(){

    clearInterval(timerInterval);

    const sec =
    Math.floor((Date.now()-startTime)/1000);

    const images =
    canvases.map(c=>c.toDataURL());

    const submitRef =
    push(ref(db,"submissions"));

    await set(submitRef,{

        time:sec,
        problems,
        images,
        checked:false,
        results:[]
    });

    alert("제출 완료");
}


// 교사 화면
function loadSubmissions(){

    const list =
    document.getElementById("submissionList");

    onValue(ref(db,"submissions"),(snapshot)=>{

        const data = snapshot.val();

        list.innerHTML = "";

        if(!data){

            list.innerHTML="제출 없음";

            return;
        }

        Object.entries(data)
        .reverse()
        .forEach(([key,item])=>{

            const wrap =
            document.createElement("div");

            wrap.className = "card";

            let html =
            `
            <div class="teacher-info">
            푼 시간:
            ${item.time}초
            </div>

            <div class="submission-grid">
            `;

            item.problems.forEach((p,index)=>{

                html +=
                `
                <div class="submission-box">

                    <div class="problem">

                    ${p.a}
                    ${p.op==="add"?"+":"-"}
                    ${p.b}

                    </div>

                    <img src="${item.images[index]}">

                    <div class="ox-buttons">

                        <button
                        class="correct"

                        onclick="gradeSubmission(
                        '${key}',
                        ${index},
                        true
                        )">

                        O

                        </button>

                        <button
                        class="wrong"

                        onclick="gradeSubmission(
                        '${key}',
                        ${index},
                        false
                        )">

                        X

                        </button>

                    </div>

                </div>
                `;
            });

            html += "</div>";

            wrap.innerHTML = html;

            list.appendChild(wrap);
        });
    });
}


// 채점
window.gradeSubmission =
async function(key,index,result){

    const target =
    ref(db,`submissions/${key}`);

    onValue(target,async(snapshot)=>{

        const data = snapshot.val();

        const results =
        data.results || [];

        results[index] = result;

        await update(target,{

            checked:true,
            results
        });

    },{onlyOnce:true});
}


// 오답 다시하기
function listenRetry(){

    onValue(ref(db,"submissions"),(snapshot)=>{

        const data = snapshot.val();

        const retryArea =
        document.getElementById("retryArea");

        retryArea.innerHTML = "";

        if(!data) return;

        Object.values(data).forEach(item=>{

            if(!item.checked) return;

            const wrongs = [];

            item.results.forEach((r,index)=>{

                if(r===false){

                    wrongs.push(
                        item.problems[index]
                    );
                }
            });

            if(wrongs.length>0){

                const div =
                document.createElement("div");

                div.className = "retry-box";

                let html =
                "<b>오답 다시하기</b>";

                wrongs.forEach(p=>{

                    html +=
                    `
                    <div style="margin-top:4px;">

                    ${p.a}
                    ${p.op==="add"?"+":"-"}
                    ${p.b}
                    = ?

                    </div>
                    `;
                });

                div.innerHTML = html;

                retryArea.appendChild(div);
            }
        });
    });
}

</script>

</body>
</html>
