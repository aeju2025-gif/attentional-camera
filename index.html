<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 수학 마스터 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-gray: #f2f2f7; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500; }
        * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input, button, select { user-select: auto; -webkit-user-select: auto; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-gray); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; padding: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 1rem; }
        .btn-student { background: var(--ios-blue); width: 100%; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; margin-bottom: 15px; background: white; }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .problem-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px; position: relative; height: 240px; display: flex; flex-direction: column; box-sizing: border-box; }
        .problem-header { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 5px; }
        .problem-text { font-size: 2rem; font-weight: bold; text-align: center; border-bottom: 2.5px solid #333; padding: 0 20px; line-height: 1.2; }
        .canvas-wrapper { flex: 1; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; touch-action: none; display: block; }
        .grade-btn-group { display: flex; gap: 10px; margin-top: 10px; height: 55px; }
        .btn-o { background: var(--ios-green); flex: 1; font-size: 1.6rem; }
        .btn-x { background: var(--ios-red); flex: 1; font-size: 1.6rem; }
        .mark-overlay { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; font-weight: bold; pointer-events: none; z-index: 10; opacity: 0.4; }
        .mark-o { color: var(--ios-green); }
        .mark-x { color: var(--ios-red); }
        .hidden { display: none !important; }
        #timerDisplay { font-size: 1.3rem; font-weight: bold; color: var(--ios-red); }
        .set-info { background: #333; color: white; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; }
        .log-item { border: 1px solid #ddd; border-radius: 12px; margin-bottom: 10px; background: white; }
        .log-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="loginGate" class="container">
    <h2 style="text-align:center;">🏫 온라인 연산 교실</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <button class="btn btn-student" style="height:120px;" onclick="initStudent()">학생용</button>
        <button class="btn" style="height:120px; background:#5856d6;" onclick="showView('teacherLogin')">교사용</button>
    </div>
</div>

<div id="studentMain" class="container hidden">
    <div style="display:flex; gap:8px; margin-bottom:15px;">
        <div id="tabNew" style="flex:1; padding:12px; text-align:center; background:var(--ios-blue); color:white; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="switchStudentTab('new')">문제 풀기</div>
        <div id="tabWrong" style="flex:1; padding:12px; text-align:center; background:#e5e5ea; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="switchStudentTab('wrong')">오답 노트 (<span id="wrongCount">0</span>)</div>
    </div>
    <div id="newSetup">
        <select id="opMain" onchange="updateSubOptions()"><option value="add">덧셈 (+)</option><option value="sub">뺄셈 (-)</option></select>
        <select id="opSub"></select>
        <select id="setCount"><option value="1">1장</option><option value="2">2장</option><option value="3">3장</option><option value="5" selected>5장</option></select>
        <button class="btn btn-student" onclick="startContinuousQuiz()">학습 시작하기</button>
    </div>
    <div id="wrongNoteArea" class="hidden">
        <div id="wrongQuizGrid" class="quiz-grid"></div>
        <button class="btn" style="width:100%; margin-top:20px; background:var(--ios-orange); height:65px;" onclick="submitWrongNote()">오답 노트 제출 완료</button>
    </div>
</div>

<div id="quizSection" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div id="timerDisplay">00:00</div>
        <div id="setIndicator" class="set-info">1 / 1 장</div>
        <button class="btn" style="background:var(--ios-green); padding:8px 20px;" onclick="handleSetSubmit()">제출 / 다음</button>
    </div>
    <div id="quizArea" class="quiz-grid"></div>
</div>

<div id="teacherLogin" class="container hidden">
    <input type="password" id="tPass" placeholder="비밀번호 1234" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px;">
    <button class="btn" style="background:#5856d6; width:100%;" onclick="checkTeacher()">로그인</button>
</div>

<div id="teacherDashboard" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">📋 실시간 제출 목록</h3>
        <button class="btn" style="background:#8e8e93; padding:5px 15px;" onclick="location.reload()">나가기</button>
    </div>
    <div id="logList">목록을 불러오는 중...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",
        authDomain: "math-98dc8.firebaseapp.com",
        databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com",
        projectId: "math-98dc8",
        storageBucket: "math-98dc8.firebasestorage.app",
        messagingSenderId: "998893080786",
        appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let timer, seconds = 0, currentProblems = [], canvases = [], currentSet = 1, targetSets = 1;

    const subSteps = {
        add: [{v: "1", t: "받아올림 몇+몇"}, {v: "2", t: "받아올림 몇십몇+몇"}, {v: "3", t: "몇십몇+몇십몇"}],
        sub: [{v: "1", t: "받아내림 몇십-몇"}, {v: "2", t: "몇십몇-몇십몇"}]
    };

    function showView(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function updateSubOptions() {
        const main = document.getElementById('opMain').value;
        document.getElementById('opSub').innerHTML = subSteps[main].map(s => `<option value="${s.v}">${s.t}</option>`).join('');
    }
    function initStudent() { showView('studentMain'); updateSubOptions(); listenToWrongNotes(); }
    function switchStudentTab(tab) {
        document.getElementById('newSetup').classList.toggle('hidden', tab !== 'new');
        document.getElementById('wrongNoteArea').classList.toggle('hidden', tab !== 'wrong');
        if(tab === 'wrong') setTimeout(initWrongCanvases, 400);
    }

    function startContinuousQuiz() { 
        currentSet = 1; targetSets = parseInt(document.getElementById('setCount').value); 
        startQuiz(); 
    }

    function startQuiz() {
        showView('quizSection'); seconds = 0;
        document.getElementById('setIndicator').innerText = `${currentSet} / ${targetSets} 장`;
        const area = document.getElementById('quizArea'); area.innerHTML = ""; currentProblems = []; canvases = [];
        for(let i=0; i<8; i++) {
            const p = { n1: Math.floor(Math.random()*50)+10, n2: Math.floor(Math.random()*40)+5, op: document.getElementById('opMain').value === 'add' ? '+' : '-' };
            currentProblems.push(p); createCard(area, p, i, 'c');
        }
        if(timer) clearInterval(timer);
        timer = setInterval(() => { seconds++; document.getElementById('timerDisplay').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000);
    }

    function createCard(target, p, i, prefix) {
        const card = document.createElement('div');
        card.className = 'problem-card';
        card.innerHTML = `
            <div class="problem-header"><div class="problem-text">${p.n1} ${p.op} ${p.n2}</div></div>
            <div class="canvas-wrapper"><canvas id="${prefix}-canv-${i}"></canvas></div>
            <button onclick="clearCnv('${prefix}-canv-${i}')" style="position:absolute; bottom:8px; left:8px; border:none; background:rgba(0,0,0,0.1); padding:4px 10px; border-radius:5px; font-size:0.7rem;">지우기</button>
        `;
        target.appendChild(card);
        setTimeout(() => setupCanvas(`${prefix}-canv-${i}`), 50);
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id); if(!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width; canvas.height = rect.height;
        const ctx = canvas.getContext('2d'); let drawing = false;
        canvas.addEventListener('pointerdown', (e) => { if(e.pointerType==='pen'){ e.preventDefault(); drawing=true; ctx.beginPath(); ctx.moveTo(e.clientX-canvas.getBoundingClientRect().left, e.clientY-canvas.getBoundingClientRect().top); } });
        canvas.addEventListener('pointermove', (e) => { if(drawing && e.pointerType==='pen'){ e.preventDefault(); const r=canvas.getBoundingClientRect(); ctx.lineWidth=2.5; ctx.strokeStyle='#007AFF'; ctx.lineTo(e.clientX-r.left, e.clientY-r.top); ctx.stroke(); } });
        canvas.addEventListener('pointerup', () => drawing=false);
        if(id.startsWith('c-canv')) canvases[id.split('-').pop()] = canvas;
    }

    function clearCnv(id) { const c = document.getElementById(id); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }

    function handleSetSubmit() {
        const data = { date: new Date().toLocaleString(), timeSpent: document.getElementById('timerDisplay').innerText, imgs: canvases.map(c => c.toDataURL()), problems: currentProblems, grades: new Array(8).fill(null), setNum: currentSet };
        database.ref('records').push(data).then(() => {
            if(currentSet < targetSets) { currentSet++; startQuiz(); window.scrollTo(0,0); } 
            else { alert("완료!"); location.reload(); }
        });
    }

    function checkTeacher() { if(document.getElementById('tPass').value === "1234") { showView('teacherDashboard'); loadTeacherLogs(); } else alert("오류"); }

    /* 교사용 채점 로직 개선: 목록 새로고침 방지 */
    function loadTeacherLogs() {
        // .once로 한 번만 로드하여 버튼 누를 때마다 전체가 리렌더링되는 것을 방지
        database.ref('records').on('value', (snap) => {
            const logs = snap.val();
            const list = document.getElementById('logList');
            if (!logs) { list.innerHTML = "내역 없음"; return; }
            
            // 현재 열려있는 로그의 ID를 기억 (있다면)
            const openIds = Array.from(document.querySelectorAll('.log-content[style*="display: block"]')).map(el => el.id.replace('content-', ''));

            list.innerHTML = "";
            Object.keys(logs).reverse().forEach(id => {
                const l = logs[id];
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <div class="log-header" onclick="toggleLog('${id}')">
                        <strong>${l.date}</strong> <span>제${l.setNum}장 (${l.timeSpent})</span>
                    </div>
                    <div id="content-${id}" class="log-content" style="display: ${openIds.includes(id) ? 'block' : 'none'}; padding: 10px;">
                        <div class="quiz-grid">
                            ${l.problems.map((p, i) => `
                                <div class="problem-card" style="height:230px;" id="card-${id}-${i}">
                                    <div class="problem-text" style="font-size:1.5rem;">${p.n1} ${p.op} ${p.n2}</div>
                                    <img src="${l.imgs[i]}" style="width:100%; height:90px; object-fit:contain;">
                                    <div class="grade-btn-group">
                                        <button class="btn btn-o" onclick="gradeOnline('${id}', ${i}, 'O')">O</button>
                                        <button class="btn btn-x" onclick="gradeOnline('${id}', ${i}, 'X')">X</button>
                                    </div>
                                    <div class="mark-overlay ${l.grades && l.grades[i]==='O'?'mark-o':'mark-x'}" id="mark-${id}-${i}">${(l.grades && l.grades[i]) || ''}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        });
    }

    function toggleLog(id) {
        const el = document.getElementById(`content-${id}`);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function gradeOnline(rid, idx, status) {
        // DB 업데이트
        database.ref(`records/${rid}/grades/${idx}`).set(status);
        
        // 화면 즉시 반영 (오버레이 표시)
        const mark = document.getElementById(`mark-${rid}-${idx}`);
        if(mark) {
            mark.innerText = status;
            mark.className = `mark-overlay ${status === 'O' ? 'mark-o' : 'mark-x'}`;
        }

        // 오답일 경우 오답노트에 추가
        if(status === 'X') {
            database.ref(`records/${rid}/problems/${idx}`).once('value', s => {
                database.ref('wrongNotes').push({ problem: s.val() });
            });
        }
    }

    function listenToWrongNotes() {
        database.ref('wrongNotes').on('value', snap => {
            document.getElementById('wrongCount').innerText = snap.val() ? Object.keys(snap.val()).length : 0;
            const area = document.getElementById('wrongQuizGrid'); area.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach((id, i) => createCard(area, snap.val()[id].problem, i, 'w'));
        });
    }
    function initWrongCanvases() { document.querySelectorAll('#wrongQuizGrid canvas').forEach(c => setupCanvas(c.id)); }
    function submitWrongNote() { if(confirm("제출?")) database.ref('wrongNotes').remove().then(() => location.reload()); }
</script>
</body>
</html>
