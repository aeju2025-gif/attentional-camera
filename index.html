<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>받아올림 덧셈 연산 앱</title>

<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }

    body{
        font-family:-apple-system,BlinkMacSystemFont,sans-serif;
        background:#f5f5f5;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:900px;
    }

    .top-bar{
        display:flex;
        gap:10px;
        margin-bottom:15px;
        flex-wrap:wrap;
    }

    input, button, select{
        padding:12px;
        font-size:18px;
        border-radius:10px;
        border:none;
    }

    button{
        background:#007AFF;
        color:white;
        cursor:pointer;
    }

    button:hover{
        opacity:0.9;
    }

    .problem-box{
        background:white;
        border-radius:20px;
        padding:20px;
        margin-bottom:15px;
        text-align:center;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .problem{
        font-size:48px;
        font-weight:bold;
    }

    .canvas-container{
        background:white;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        margin-bottom:15px;
    }

    canvas{
        width:100%;
        height:500px;
        background:white;
        touch-action:none;
        display:block;
    }

    .button-group{
        display:flex;
        gap:10px;
        margin-bottom:20px;
        flex-wrap:wrap;
    }

    .teacher-panel{
        background:white;
        border-radius:20px;
        padding:20px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .submission{
        border:1px solid #ddd;
        border-radius:15px;
        padding:15px;
        margin-top:15px;
    }

    .submission img{
        width:100%;
        max-width:400px;
        border:1px solid #ddd;
        margin-top:10px;
    }

    .correct{
        color:green;
        font-weight:bold;
    }

    .wrong{
        color:red;
        font-weight:bold;
    }

</style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <input type="text" id="studentName" placeholder="학생 이름 입력">
        <button onclick="generateProblem()">새 문제</button>
    </div>

    <div class="problem-box">
        <div class="problem" id="problem">8 + 7 = ?</div>
    </div>

    <div class="canvas-container">
        <canvas id="drawCanvas"></canvas>
    </div>

    <div class="button-group">
        <button onclick="clearCanvas()">지우기</button>
        <button onclick="submitAnswer()">제출하기</button>
    </div>

    <div class="teacher-panel">
        <h2>교사 채점 화면</h2>

        <button onclick="loadSubmissions()">제출 새로고침</button>

        <div id="submissionList"></div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getAnalytics
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";


// Firebase 설정
const firebaseConfig = {
    apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",
    authDomain: "math-98dc8.firebaseapp.com",
    databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com",
    projectId: "math-98dc8",
    storageBucket: "math-98dc8.firebasestorage.app",
    messagingSenderId: "998893080786",
    appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b",
    measurementId: "G-TC28EDFTWR"
};

// Firebase 초기화
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);


// 문제 변수
let num1 = 8;
let num2 = 7;


// 문제 생성
window.generateProblem = function(){

    while(true){

        let a = Math.floor(Math.random() * 9) + 1;
        let b = Math.floor(Math.random() * 9) + 1;

        if(a + b >= 10){

            num1 = a;
            num2 = b;

            document.getElementById("problem").innerText =
                `${num1} + ${num2} = ?`;

            clearCanvas();

            break;
        }
    }
}


// 캔버스 설정
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = canvas.offsetWidth;
    canvas.height = 500;

    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// 필기 기능
let drawing = false;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    if(e.touches){
        return {
            x:e.touches[0].clientX - rect.left,
            y:e.touches[0].clientY - rect.top
        };
    }

    return {
        x:e.clientX - rect.left,
        y:e.clientY - rect.top
    };
}


function startDraw(e){

    drawing = true;

    const pos = getPos(e);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function draw(e){

    if(!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function endDraw(){

    drawing = false;
}


canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", endDraw);

canvas.addEventListener("touchstart", startDraw);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", endDraw);


// 지우기
window.clearCanvas = function(){

    ctx.clearRect(0,0,canvas.width,canvas.height);
}


// 제출
window.submitAnswer = async function(){

    const studentName =
        document.getElementById("studentName").value.trim();

    if(studentName === ""){
        alert("학생 이름을 입력하세요");
        return;
    }

    const imageData = canvas.toDataURL("image/png");

    const submissionRef = push(ref(db, "submissions"));

    await set(submissionRef, {

        studentName: studentName,

        problem: `${num1} + ${num2}`,

        answer: num1 + num2,

        image: imageData,

        timestamp: Date.now()
    });

    alert("제출 완료!");

    generateProblem();
}


// 교사 화면
window.loadSubmissions = function(){

    const submissionsRef = ref(db, "submissions");

    onValue(submissionsRef, (snapshot)=>{

        const data = snapshot.val();

        const list =
            document.getElementById("submissionList");

        list.innerHTML = "";

        if(!data){
            list.innerHTML = "<p>제출 없음</p>";
            return;
        }

        const entries =
            Object.entries(data).reverse();

        entries.forEach(([key, item])=>{

            const div = document.createElement("div");

            div.className = "submission";

            div.innerHTML = `
                <h3>${item.studentName}</h3>

                <p>
                    문제:
                    <strong>${item.problem}</strong>
                </p>

                <p>
                    정답:
                    <strong>${item.answer}</strong>
                </p>

                <img src="${item.image}">
            `;

            list.appendChild(div);
        });
    });
}


// 시작 시 문제 생성
generateProblem();

</script>

</body>
</html>
