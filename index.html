<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>연산 마스터 Pro - 딜레이 제거</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-gray: #f2f2f7; --ios-green: #34c759; --ios-red: #ff3b30; }
        * { 
            -webkit-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            /* 브라우저 기본 터치 제스처(확대, 스크롤) 완전 차단 */
            touch-action: none; 
        }
        body { font-family: -apple-system, sans-serif; background: var(--ios-gray); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; padding: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        
        /* 버튼과 선택창만 터치 허용 */
        button, select { touch-action: manipulation !important; cursor: pointer; }
        
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .problem-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px; height: 320px; display: flex; flex-direction: column; position: relative; box-sizing: border-box; }
        
        .problem-header { display: flex; justify-content: space-between; align-items: center; min-height: 85px; margin-bottom: 5px; }
        .problem-text-area { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; pointer-events: none; }
        
        .canvas-wrapper { flex: 1; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .btn-clear { border: none; background: #e5e5ea; color: #333; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginGate" class="container">
    <h2 style="text-align:center;">🏫 온라인 연산 교실</h2>
    <button class="btn" style="width:100%; height:120px; background:var(--ios-blue); border-radius:15px; color:white; font-size:1.5rem; font-weight:bold; border:none;" onclick="initStudent()">학습 시작하기</button>
</div>

<div id="studentMain" class="container hidden">
    <div style="display:grid; gap:10px;">
        <select id="opMain"><option value="add">덧셈 (+)</option><option value="sub">뺄셈 (-)</option></select>
        <select id="problemType"><option value="vert">세로셈</option><option value="horiz">가로셈</option></select>
        <button onclick="startQuiz()" style="padding:20px; background:var(--ios-blue); color:white; border:none; border-radius:12px; font-weight:bold; font-size:1.2rem;">문제를 불러옵니다</button>
    </div>
</div>

<div id="quizSection" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div id="timerDisplay" style="font-size:1.2rem; font-weight:bold; color:var(--ios-red);">00:00</div>
        <button onclick="handleSetSubmit()" style="background:var(--ios-green); color:white; border:none; padding:10px 25px; border-radius:12px; font-weight:bold;">제출 완료</button>
    </div>
    <div id="quizArea" class="quiz-grid"></div>
</div>

<script>
    // Firebase 초기화 (선생님의 설정값 유지)
    const firebaseConfig = { apiKey: "AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk", authDomain: "math-98dc8.firebaseapp.com", databaseURL: "https://math-98dc8-default-rtdb.firebaseio.com", projectId: "math-98dc8", storageBucket: "math-98dc8.firebasestorage.app", messagingSenderId: "998893080786", appId: "1:998893080786:web:fc2ce7af37e3bd0cd85d0b" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let currentProblems = [], canvases = [];

    function showView(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function initStudent() { showView('studentMain'); }

    function startQuiz() {
        showView('quizSection');
        const area = document.getElementById('quizArea'); area.innerHTML = ""; canvases = [];
        for(let i=0; i<8; i++) {
            const p = { n1: Math.floor(Math.random()*20)+10, n2: Math.floor(Math.random()*9)+1, op: '+', type: document.getElementById('problemType').value };
            currentProblems.push(p);
            const card = document.createElement('div');
            card.className = 'problem-card';
            card.innerHTML = `
                <div class="problem-header"><div style="width:40px;"></div><div class="problem-text-area">${p.n1} ${p.op} ${p.n2} =</div><button class="btn-clear" onclick="clearCnv('c-${i}')">지우기</button></div>
                <div class="canvas-wrapper"><canvas id="c-${i}"></canvas></div>
            `;
            area.appendChild(card);
            setTimeout(() => setupCanvas(`c-${i}`), 50);
        }
    }

    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        // desynchronized: true 옵션으로 드로잉 딜레이 최소화
        const ctx = canvas.getContext('2d', { desynchronized: true }); 
        let drawing = false;

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        // 펜슬 입력 최적화 로직
        const startDrawing = (e) => {
            if (e.pointerType !== 'pen') return;
            e.preventDefault();
            drawing = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
            // 점 하나 찍는 경우를 대비해 미리 점 그리기 준비
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        };

        const moveDrawing = (e) => {
            if (!drawing || e.pointerType !== 'pen') return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#007AFF';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        };

        const stopDrawing = (e) => {
            if (e.pointerType === 'pen') {
                drawing = false;
                ctx.closePath();
            }
        };

        // 딜레이 방지를 위해 passive: false 적용
        canvas.addEventListener('pointerdown', startDrawing, { passive: false });
        canvas.addEventListener('pointermove', moveDrawing, { passive: false });
        canvas.addEventListener('pointerup', stopDrawing, { passive: false });
        canvas.addEventListener('pointerleave', stopDrawing, { passive: false });

        canvases[id.split('-')[1]] = canvas;
    }

    function clearCnv(id) { const c = document.getElementById(id); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }
    function handleSetSubmit() { alert("제출되었습니다!"); location.reload(); }
</script>
</body>
</html>
