<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>수학 연산 학습 앱</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f2f2f7;
    color:#111;
}

.hidden{
    display:none !important;
}

.screen{
    min-height:100vh;
    padding:10px;
}

.center{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.big-button{
    width:260px;
    padding:18px;
    border:none;
    border-radius:18px;
    background:#007AFF;
    color:white;
    font-size:24px;
    font-weight:500;
}

input,select,button{
    font-size:16px;
    padding:10px;
    border-radius:12px;
    border:1px solid #ccc;
}

button{
    background:#007AFF;
    color:white;
    border:none;
    font-weight:500;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.timer{
    position:fixed;
    top:10px;
    left:10px;
    background:black;
    color:white;
    padding:8px 14px;
    border-radius:10px;
    font-size:18px;
    z-index:999;
}

.problem-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.problem-box{
    background:white;
    border-radius:16px;
    padding:8px;
    box-shadow:0 1px 5px rgba(0,0,0,0.08);
    position:relative;
}

.problem{
    text-align:center;
    margin-bottom:6px;
    font-weight:300;
}

.vertical-problem{
    display:inline-block;
    text-align:right;
    font-size:28px;
    line-height:1.15;
    font-family:monospace;
    font-weight:300;
}

.vertical-line{
    border-top:2px solid black;
    margin-top:2px;
}

.horizontal-problem{
    font-size:28px;
    font-weight:300;
}

canvas{
    width:100%;
    height:135px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
    touch-action:none;
    display:block;
}

.result-mark{
    position:absolute;
    top:5px;
    right:8px;
    font-size:28px;
    font-weight:600;
}

.result-o{
    color:green;
}

.result-x{
    color:red;
}

.test-item{
    background:white;
    padding:14px;
    border-radius:14px;
    margin-bottom:10px;
    box-shadow:0 1px 5px rgba(0,0,0,0.08);
}

.retry-box{
    background:#fff3cd;
    border-radius:14px;
    padding:12px;
    margin-top:14px;
}

</style>
</head>

<body>

<div id="timer" class="timer hidden">
00:00
</div>

<!-- 시작 화면 -->
<div id="startScreen"
class="screen center">

    <h1 style="font-weight:400;">
        수학 연산 앱
    </h1>

    <button class="big-button"
    onclick="showStudentSetup()">
        학생용
    </button>

    <button class="big-button"
    onclick="showTeacherScreen()">
        교사용
    </button>

</div>


<!-- 학생 설정 -->
<div id="studentSetup"
class="screen hidden">

    <div class="card">

        <h2 style="font-weight:400;">
            문제 설정
        </h2>

        <br>

        <select id="operationType">

            <option value="add">
                덧셈
            </option>

            <option value="sub">
                뺄셈
            </option>

        </select>

        <br><br>

        <select id="digitType">

            <option value="1_1">
                한자리 + 한자리
            </option>

            <option value="2_1">
                두자리 + 한자리
            </option>

            <option value="2_2">
                두자리 + 두자리
            </option>

            <option value="3_1">
                세자리 + 한자리
            </option>

            <option value="3_2">
                세자리 + 두자리
            </option>

            <option value="3_3">
                세자리 + 세자리
            </option>

        </select>

        <br><br>

        <select id="layoutType">

            <option value="vertical">
                세로셈
            </option>

            <option value="horizontal">
                가로셈
            </option>

        </select>

        <br><br>

        <select id="sheetCount">

            <option value="5">
                5장
            </option>

            <option value="10">
                10장
            </option>

        </select>

        <br><br>

        <button onclick="startStudentMode()">
            시작하기
        </button>

    </div>

</div>


<!-- 학생 화면 -->
<div id="studentScreen"
class="screen hidden">

    <div class="top-bar">

        <h2 id="sheetInfo"
        style="font-weight:400;">
        </h2>

        <button onclick="submitWorksheet()">
            제출
        </button>

    </div>

    <div id="problemGrid"
    class="problem-grid"></div>

    <div id="retryArea"></div>

</div>


<!-- 교사 화면 -->
<div id="teacherScreen"
class="screen hidden">

    <div class="top-bar">

        <h2 style="font-weight:400;">
            채점 목록
        </h2>

        <button onclick="goHome()">
            홈
        </button>

    </div>

    <div id="submissionList"></div>

</div>


<!-- 상세 채점 -->
<div id="gradingScreen"
class="screen hidden">

    <div class="top-bar">

        <h2 id="gradingTitle"
        style="font-weight:400;">
        </h2>

        <button onclick="backToTeacher()">
            뒤로
        </button>

    </div>

    <div id="gradingGrid"
    class="problem-grid"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// Firebase
const firebaseConfig = {

apiKey:"AIzaSyByzHhGCTA2yE89tYCeOkhJQ1PiyPJ9Csk",

authDomain:"math-98dc8.firebaseapp.com",

databaseURL:
"https://math-98dc8-default-rtdb.firebaseio.com",

projectId:"math-98dc8",

storageBucket:
"math-98dc8.firebasestorage.app",

messagingSenderId:"998893080786",

appId:
"1:998893080786:web:fc2ce7af37e3bd0cd85d0b",

measurementId:"G-TC28EDFTWR"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// 상태
let startTime = 0;
let timerInterval;
let problems = [];
let canvases = [];

let currentSheet = 1;
let totalSheets = 5;


// 화면
const startScreen =
document.getElementById("startScreen");

const studentSetup =
document.getElementById("studentSetup");

const studentScreen =
document.getElementById("studentScreen");

const teacherScreen =
document.getElementById("teacherScreen");

const gradingScreen =
document.getElementById("gradingScreen");


// 화면전환
function hideAll(){

startScreen.classList.add("hidden");
studentSetup.classList.add("hidden");
studentScreen.classList.add("hidden");
teacherScreen.classList.add("hidden");
gradingScreen.classList.add("hidden");
}

window.showStudentSetup = function(){

hideAll();
studentSetup.classList.remove("hidden");
}

window.showTeacherScreen = function(){

hideAll();
teacherScreen.classList.remove("hidden");

loadSubmissionList();
}

window.goHome = function(){

hideAll();
startScreen.classList.remove("hidden");
}

window.backToTeacher = function(){

hideAll();
teacherScreen.classList.remove("hidden");
}


// 학생 시작
window.startStudentMode = function(){

currentSheet = 1;

totalSheets =
Number(
document.getElementById("sheetCount").value
);

startWorksheet();
};


function startWorksheet(){

hideAll();

studentScreen.classList.remove("hidden");

document.getElementById("timer")
.classList.remove("hidden");

document.getElementById("sheetInfo")
.innerText =
`${currentSheet} / ${totalSheets} 장`;

startTime = Date.now();

startTimer();

generateWorksheet();

listenRetry();
}


// 타이머
function startTimer(){

clearInterval(timerInterval);

timerInterval = setInterval(()=>{

const sec =
Math.floor((Date.now()-startTime)/1000);

const min =
String(Math.floor(sec/60))
.padStart(2,"0");

const s =
String(sec%60)
.padStart(2,"0");

document.getElementById("timer")
.innerText =
`${min}:${s}`;

},1000);
}


// 숫자
function randomDigits(d){

if(d===1)
return Math.floor(Math.random()*9)+1;

if(d===2)
return Math.floor(Math.random()*90)+10;

return Math.floor(Math.random()*900)+100;
}


// 문제 생성
function generateWorksheet(){

problems = [];
canvases = [];

const grid =
document.getElementById("problemGrid");

grid.innerHTML = "";

const op =
document.getElementById("operationType").value;

const digit =
document.getElementById("digitType").value;

const layout =
document.getElementById("layoutType").value;

const parts = digit.split("_");

const d1 = Number(parts[0]);
const d2 = Number(parts[1]);

for(let i=0;i<8;i++){

let a,b,answer;

while(true){

a = randomDigits(d1);
b = randomDigits(d2);

if(op==="add"){

answer = a+b;
break;

}else{

if(a>=b){

answer = a-b;
break;
}
}
}

problems.push({
a,b,answer,op
});

const div =
document.createElement("div");

div.className = "problem-box";

let html = "";

if(layout==="vertical"){

html =
`
<div class="vertical-problem">

<div>
${String(a).padStart(3," ")}
</div>

<div>
${op==="add"?"+":"-"}
${String(b).padStart(3," ")}
</div>

<div class="vertical-line"></div>

</div>
`;

}else{

html =
`
<div class="horizontal-problem">
${a}
${op==="add"?"+":"-"}
${b}
=
</div>
`;
}

div.innerHTML =
`
<div class="problem">
${html}
</div>

<canvas id="canvas${i}">
</canvas>
`;

grid.appendChild(div);

setupCanvas(`canvas${i}`);
}
}


// 캔버스
function setupCanvas(id){

const canvas =
document.getElementById(id);

const ctx =
canvas.getContext("2d");

canvas.width =
canvas.offsetWidth;

canvas.height = 135;

ctx.lineWidth = 3;
ctx.lineCap = "round";

let drawing = false;

function pos(e){

const rect =
canvas.getBoundingClientRect();

if(e.touches){

return {

x:e.touches[0].clientX
- rect.left,

y:e.touches[0].clientY
- rect.top
};
}

return {

x:e.clientX - rect.left,

y:e.clientY - rect.top
};
}

canvas.addEventListener("mousedown",(e)=>{

drawing=true;

const p=pos(e);

ctx.beginPath();

ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("mousemove",(e)=>{

if(!drawing) return;

const p=pos(e);

ctx.lineTo(p.x,p.y);

ctx.stroke();
});

canvas.addEventListener("mouseup",()=>{

drawing=false;
});

canvas.addEventListener("touchstart",(e)=>{

drawing=true;

const p=pos(e);

ctx.beginPath();

ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("touchmove",(e)=>{

e.preventDefault();

if(!drawing) return;

const p=pos(e);

ctx.lineTo(p.x,p.y);

ctx.stroke();
});

canvas.addEventListener("touchend",()=>{

drawing=false;
});

canvases.push(canvas);
}


// 제출
window.submitWorksheet = async function(){

clearInterval(timerInterval);

const sec =
Math.floor((Date.now()-startTime)/1000);

const images =
canvases.map(c=>c.toDataURL());

const now = new Date();

const title =
`${now.getFullYear()}-${
String(now.getMonth()+1)
.padStart(2,"0")
}-${
String(now.getDate())
.padStart(2,"0")
}
${
String(now.getHours())
.padStart(2,"0")
}:${
String(now.getMinutes())
.padStart(2,"0")
}`;

const submitRef =
push(ref(db,"submissions"));

await set(submitRef,{

title,
time:sec,
problems,
images,
results:[],
checked:false
});

if(currentSheet < totalSheets){

currentSheet++;

startWorksheet();

}else{

alert("모든 문제 완료");

goHome();
}
};


// 목록
function loadSubmissionList(){

const list =
document.getElementById("submissionList");

onValue(ref(db,"submissions"),
(snapshot)=>{

const data = snapshot.val();

list.innerHTML = "";

if(!data){

list.innerHTML="제출 없음";
return;
}

Object.entries(data)
.reverse()
.forEach(([key,item])=>{

const div =
document.createElement("div");

div.className = "test-item";

div.innerHTML =
`
<div>
${item.title}
</div>

<div style="
margin-top:6px;
font-size:14px;
">

풀이 시간:
${item.time}초

</div>

<button
style="margin-top:10px"

onclick="openGrading(
'${key}'
)">

채점하기

</button>
`;

list.appendChild(div);
});
});
}


// 채점 열기
window.openGrading =
function(key){

hideAll();

gradingScreen
.classList.remove("hidden");

const grid =
document.getElementById("gradingGrid");

grid.innerHTML = "";

onValue(ref(db,
`submissions/${key}`),

(snapshot)=>{

const item =
snapshot.val();

document.getElementById(
"gradingTitle"
).innerText =
item.title;

grid.innerHTML = "";

item.problems
.forEach((p,index)=>{

const div =
document.createElement("div");

div.className =
"problem-box";

const result =
item.results?.[index];

let mark = "";

if(result===true){

mark =
`
<div class="
result-mark
result-o
">
O
</div>
`;

}else if(result===false){

mark =
`
<div class="
result-mark
result-x
">
X
</div>
`;
}

div.innerHTML =
`
${mark}

<div class="problem">

<div class="
horizontal-problem
">

${p.a}
${p.op==="add"?"+":"-"}
${p.b}

</div>

</div>

<img
src="${item.images[index]}"
style="
width:100%;
border-radius:10px;
border:1px solid #ccc;
">

<div style="
display:flex;
gap:6px;
margin-top:6px;
">

<button
style="background:green"

onclick="
gradeSubmission(
'${key}',
${index},
true
)
">

O

</button>

<button
style="background:red"

onclick="
gradeSubmission(
'${key}',
${index},
false
)
">

X

</button>

</div>
`;

grid.appendChild(div);
});
});
};


// 채점
window.gradeSubmission =
async function(
key,
index,
result
){

const target =
ref(db,`submissions/${key}`);

onValue(target,
async(snapshot)=>{

const data =
snapshot.val();

const results =
data.results || [];

results[index] =
result;

await update(target,{

checked:true,
results
});

},{onlyOnce:true});
};


// 오답
function listenRetry(){

const retryArea =
document.getElementById("retryArea");

onValue(ref(db,"submissions"),

(snapshot)=>{

const data =
snapshot.val();

retryArea.innerHTML = "";

if(!data) return;

Object.values(data)
.forEach(item=>{

if(!item.checked)
return;

const wrongs = [];

item.results
.forEach((r,index)=>{

if(r===false){

wrongs.push({

problem:
item.problems[index],

image:
item.images[index]
});
}
});

if(wrongs.length>0){

const div =
document.createElement("div");

div.className =
"retry-box";

let html =
`
<h3 style="
font-weight:400;
margin-bottom:8px;
">
오답 다시하기
</h3>
`;

wrongs.forEach((w,i)=>{

html +=
`
<div style="
margin-top:10px;
">

${w.problem.a}
${w.problem.op==="add"
?"+":"-"}

${w.problem.b}
= ?

<button
onclick="
retryWrong(
${w.problem.a},
${w.problem.b},
'${w.problem.op}'
)
">

다시 풀기

</button>

</div>
`;
});

div.innerHTML = html;

retryArea.appendChild(div);
}
});
});
}


// 오답 다시풀기
window.retryWrong =
function(a,b,op){

hideAll();

studentScreen
.classList.remove("hidden");

const grid =
document.getElementById(
"problemGrid"
);

grid.innerHTML = "";

problems = [{
a,b,
answer:
op==="add"
?a+b
:a-b,
op
}];

const div =
document.createElement("div");

div.className =
"problem-box";

div.innerHTML =
`
<div class="
horizontal-problem
">

${a}
${op==="add"?"+":"-"}
${b}
=

</div>

<canvas id="retryCanvas">
</canvas>

<button
style="
margin-top:8px;
"

onclick="
submitRetry()
">

오답 제출

</button>
`;

grid.appendChild(div);

setupCanvas("retryCanvas");
};


// 오답 제출
window.submitRetry =
async function(){

const images =
canvases.map(c=>c.toDataURL());

const submitRef =
push(ref(db,"submissions"));

await set(submitRef,{

title:"오답 다시풀기",

time:0,

problems,

images,

results:[],

checked:false
});

alert("오답 제출 완료");
};

</script>

</body>
</html>
