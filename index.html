<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>집중 기록 카메라 - 비공개 모드</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; background: #fafafa; color: #333; }
        #container { position: relative; width: 90%; max-width: 500px; margin-top: 20px; }
        video { width: 100%; border-radius: 20px; background: #000; transform: scaleX(-1); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        /* 타이머는 이제 화면에서 보이지 않게 처리 (필요시 검사기로만 확인 가능) */
        #timer { display: none; } 
        
        .status-dot { position: absolute; top: 20px; right: 20px; width: 12px; height: 12px; background: red; border-radius: 50%; display: none; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 15px; }
        button { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        #startBtn { background: #007AFF; color: white; }
        #startBtn:disabled { background: #ccc; }
        
        /* 평가 섹션 스타일 */
        .evaluation-area, .playback-area { 
            margin-top: 30px; display: none; width: 90%; max-width: 500px; 
            padding: 20px; background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .eval-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .eval-btn { background: #f0f0f0; border: 1px solid #ddd; padding: 10px 20px; }
        .eval-btn:hover { background: #e0e0e0; }
        .selected-eval { background: #007AFF !important; color: white; border-color: #007AFF; }
    </style>
</head>
<body>

    <h2>🎯 집중 기록 모드</h2>
    <p style="color: #666; font-size: 0.9rem;">녹화 중에는 타이머가 표시되지 않습니다.</p>
    
    <div id="container">
        <div class="status-dot" id="statusDot"></div> <video id="preview" autoplay muted playsinline></video>
        <div id="timer">0</div>
    </div>

    <div class="controls">
        <input type="number" id="minutes" value="1" min="1" style="width: 50px; padding: 8px; border-radius: 8px; border: 1px solid #ddd;"> 분 집중하기
        <button id="startBtn">집중 시작</button>
    </div>

    <div class="evaluation-area" id="evaluationArea">
        <h3>오늘의 집중도는 어땠나요?</h3>
        <div class="eval-buttons">
            <button class="eval-btn" onclick="selectEval(this, '상')">🔥 상</button>
            <button class="eval-btn" onclick="selectEval(this, '중')">👍 중</button>
            <button class="eval-btn" onclick="selectEval(this, '하')">☁️ 하</button>
        </div>
        <button id="saveEvalBtn" style="margin-top: 20px; width: 100%; background: #333; color: white;" onclick="showPlayback()">평가 완료</button>
    </div>

    <div class="playback-area" id="playbackArea">
        <h3>✅ 기록 확인 (<span id="userRating"></span>)</h3>
        <video id="recording" controls style="transform: none;"></video>
        <div style="margin-top:15px;">
            재생 속도: 
            <button class="eval-btn" onclick="setSpeed(1)">1x</button>
            <button class="eval-btn" onclick="setSpeed(2)">2x</button>
            <button class="eval-btn" onclick="setSpeed(4)">4x</button>
        </div>
        <p style="margin-top: 20px;"><a id="downloadLink" style="color: #007AFF; text-decoration: none; font-weight: bold;">📥 영상 소장하기</a></p>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let timerInterval;
        let timeLeft;
        let selectedRating = "";

        const preview = document.getElementById('preview');
        const recording = document.getElementById('recording');
        const startBtn = document.getElementById('startBtn');
        const evaluationArea = document.getElementById('evaluationArea');
        const playbackArea = document.getElementById('playbackArea');
        const statusDot = document.getElementById('statusDot');

        // 알람음 생성 함수 (짧은 비프음)
        function playAlarm() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.connect(gain);
            gain.connect(context.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, context.currentTime); // A4 음계
            gain.gain.setValueAtTime(0, context.currentTime);
            gain.gain.linearRampToValueAtTime(1, context.currentTime + 0.01);
            oscillator.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.5);
            oscillator.stop(context.currentTime + 0.5);
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = stream;
                return stream;
            } catch (err) { alert("카메라 권한이 필요합니다."); }
        }

        startBtn.onclick = async () => {
            const stream = await initCamera();
            if (!stream) return;

            recordedChunks = [];
            timeLeft = document.getElementById('minutes').value * 60;
            
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                recording.src = URL.createObjectURL(blob);
                document.getElementById('downloadLink').href = recording.src;
                document.getElementById('downloadLink').download = `focus_${new Date().getTime()}.webm`;
                
                // 녹화 종료 후 평가 창 띄우기
                evaluationArea.style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            mediaRecorder.start();
            statusDot.style.display = 'block';
            startBtn.disabled = true;

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    stopRecording();
                }
            }, 1000);
        };

        function stopRecording() {
            clearInterval(timerInterval);
            playAlarm(); // 알람 울리기
            mediaRecorder.stop();
            preview.srcObject.getTracks().forEach(track => track.stop());
            statusDot.style.display = 'none';
            startBtn.disabled = false;
        }

        // 집중도 선택 함수
        function selectEval(btn, rating) {
            document.querySelectorAll('.eval-btn').forEach(b => b.classList.remove('selected-eval'));
            btn.classList.add('selected-eval');
            selectedRating = rating;
        }

        // 평가 완료 후 재생 영역 표시
        function showPlayback() {
            if (!selectedRating) {
                alert("집중도를 선택해주세요!");
                return;
            }
            document.getElementById('userRating').innerText = "내 점수: " + selectedRating;
            evaluationArea.style.display = 'none';
            playbackArea.style.display = 'block';
        }

        function setSpeed(speed) {
            recording.playbackRate = speed;
        }

        initCamera();
    </script>
</body>
</html>
